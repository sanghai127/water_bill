function attachReadingHandlers(){
  attachSearchToolbarHandlers('search-readings','search-readings-btn','search-readings-clear',
    q=>{ readingsSearchQuery=q; }, ()=>{ readingsSearchQuery=''; });
  const clearFilter = document.getElementById('clear-readings-filter');
  if(clearFilter) clearFilter.addEventListener('click', ()=>{ readingsHeadsUpFilter = null; render(); });
  const add = document.getElementById('add-reading');
  if(add) add.addEventListener('click', ()=>{
    if(!DB.meters.some(m=>m.status==='Active')){ showToast('Add an active meter first'); return; }
    openForm='meter_readings'; render();
  });
  const cancel = document.getElementById('cancel-reading');
  if(cancel) cancel.addEventListener('click', ()=>{ openForm=null; render(); });

  const meterSel = document.getElementById('f-meter_id');
  function fillPrevious(){
    const meterId = meterSel.value;
    const past = DB.meter_readings.filter(r=>r.meter_id===meterId).sort((a,b)=>b.reading_date.localeCompare(a.reading_date));
    document.getElementById('f-previous_reading').value = past.length ? past[0].current_reading : 0;
  }
  if(meterSel){ meterSel.addEventListener('change', fillPrevious); fillPrevious(); }

  const save = document.getElementById('save-reading');
  if(save) save.addEventListener('click', async ()=>{
    const meter_id = document.getElementById('f-meter_id').value;
    const reading_date = document.getElementById('f-reading_date').value;
    const previous_reading = +document.getElementById('f-previous_reading').value;
    const current_reading = +document.getElementById('f-current_reading').value;
    if(!meter_id || !reading_date || isNaN(current_reading)){ showToast('Fill in all fields'); return; }
    if(current_reading < previous_reading){ showToast('Current reading cannot be less than previous reading'); return; }
    const dupReading = DB.meter_readings.find(r=>r.meter_id===meter_id && r.reading_date===reading_date);
    if(dupReading){
      if(DB.bills.some(b=>b.reading_id===dupReading.reading_id)){
        showToast("That meter already has a billed reading on this date - use a different date");
        return;
      }
      dupReading.previous_reading = previous_reading;
      dupReading.current_reading = current_reading;
      await saveTable('meter_readings');
      showToast(`Merged into existing reading ${dupReading.reading_id} for this date`);
    } else {
      const reading_id = nextId('R-', DB.meter_readings, 'reading_id', 4);
      DB.meter_readings.push({reading_id, meter_id, reading_date, previous_reading, current_reading});
      await saveTable('meter_readings');
      showToast('Reading saved');
    }
    openForm=null;
    render();
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-delete');
      const blockers = blockersForReading(id);
      if(blockers.length){
        showToast(`Can't delete - ${blockers.join(' and ')} already refers to this reading`);
        return;
      }
      askDelete(`Reading ${id} will be removed.`, ()=>deleteRecord('meter_readings', r=>r.reading_id===id));
    });
  });
}

/* ===================== BILLS ===================== */
function billMatchesSearch(b, query){
  if(!query) return true;
  const t = billTotals(b);
  return matchesExact(query, [
    b.bill_no, b.consumer_no, consumerName(b.consumer_no), billMeterNumber(b), b.billing_month, t.status
  ]);
}
function renderBills(){
  let filterFn = null, filterLabel = '';
  if(billsHeadsUpFilter==='overdue'){
    filterFn = b=>billTotals(b).overdue;
    filterLabel = 'Overdue bills';
  } else if(billsHeadsUpFilter==='unpaid'){
    filterFn = b=>{ const t = billTotals(b); return t.status!=='Paid' && !t.overdue; };
    filterLabel = 'Unpaid / partial bills (not yet overdue)';
  }
  if(billsSearchQuery){
    const baseFilter = filterFn;
    filterFn = b => (baseFilter ? baseFilter(b) : true) && billMatchesSearch(b, billsSearchQuery);
  }
  const groups = groupBillsByConsumerMeter(filterFn);
  const formHtml = openForm==='bills' ? billForm() : '';
  return `
  <div class="page-head">
    <div><h1 class="page-title">Bills</h1><div class="page-desc">One row per consumer + meter - every bill for the same consumer_no and meter_no is rolled into one entry, showing the total amount owed against that individual. Click a row to see the individual bills.</div></div>
  </div>
  ${filterLabel ? `<div class="banner">Showing only: <b>${filterLabel}</b>${' '}<button class="btn-cancel" id="clear-bills-filter">Show all bills</button></div>` : ''}
  <div class="toolbar" style="justify-content:space-between;flex-wrap:wrap;">
    ${searchToolbarHtml('search-bills','search-bills-btn','search-bills-clear', billsSearchQuery, 'Search bills (any field)')}
    <div>${openForm==='bills' ? '' : `<button class="btn-add" id="add-bill">+ Generate bill</button> <button class="btn-add" id="add-bill-lumpsum">+ Lump sum bill (no meter)</button>`}</div>
  </div>
  ${formHtml}
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th></th><th>Consumer</th><th>Meter No</th><th># Bills</th><th>Latest Month</th>
        <th>Total Billed</th><th>Total Paid</th><th>Total Outstanding</th><th>Status</th>
      </tr></thead>
      <tbody>
        ${groups.length ? groups.map(g=>{
          const totals = g.bills.reduce((s,b)=>{
            const t = billTotals(b);
            s.billed += t.grand_total_due;
            s.paid += t.paid;
            s.outstanding += Math.max(0, t.grand_total_due - t.paid);
            if(t.status==='Partial') s.anyPartial = true;
            return s;
          }, {billed:0, paid:0, outstanding:0, anyPartial:false});
          const groupStatus = totals.outstanding<=0 ? 'Paid' : (totals.anyPartial ? 'Partial' : 'Unpaid');
          const isOpen = expandedBillGroups.has(g.key);
          const latest = g.bills[0];
          const groupRow = `<tr class="group-row" data-toggle-group="${escapeHtml(g.key)}">
            <td class="num">${isOpen ? '\u25BE' : '\u25B8'}</td>
            <td>${escapeHtml(consumerName(g.consumer_no))} <span style="color:var(--slate)">(${escapeHtml(g.consumer_no)})</span></td>
            <td class="num">${escapeHtml(g.meter_number)}</td>
            <td class="num">${g.bills.length}</td>
            <td>${escapeHtml(latest.billing_month)}</td>
            <td class="num">Nu. ${money(totals.billed)}</td>
            <td class="num">Nu. ${money(totals.paid)}</td>
            <td class="num">Nu. ${money(totals.outstanding)}</td>
            <td>${statusPill(groupStatus)}</td>
          </tr>`;
          const detailRows = isOpen ? g.bills.map(b=>{
            const t = billTotals(b);
            const reading = DB.meter_readings.find(r=>r.reading_id===b.reading_id);
            const consumption = reading ? reading.current_reading-reading.previous_reading : 0;
            return `<tr class="detail-row">
              <td></td>
              <td colspan="2">Bill #${b.bill_no} \u2014 ${escapeHtml(b.billing_month)}, due ${b.due_date}</td>
              <td class="num">${consumption} units</td>
              <td class="num">${money(t.total_bill)}${t.penalty ? ` <span style="color:var(--red)">+${money(t.penalty)} pen.</span>` : ''}</td>
              <td class="num">${money(t.paid)}</td>
              <td class="num" colspan="2">Nu. ${money(t.grand_total_due-t.paid)} due &nbsp; ${statusPill(t.status)}</td>
              <td class="row-actions"><button data-invoice="${b.bill_no}">View</button> ${t.paid>0 ? '' : `<button class="del" data-delete="${b.bill_no}">Delete</button>`}</td>
            </tr>`;
          }).join('') : '';
          return groupRow + detailRows;
        }).join('') : `<tr><td colspan="9" class="empty">${billsSearchQuery ? `No bill found matching "${escapeHtml(billsSearchQuery)}"` : (filterLabel ? `No ${filterLabel.toLowerCase()} right now` : 'No bills yet - generate one from a pending reading')}</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

    `<option value="${escapeHtml(c.consumer_no)}">${escapeHtml(c.consumer_no)} - ${escapeHtml(c.name)} (Meter No. Nil)</option>`).join('');

    <div class="form-grid">

      <div><label>Bill Date</label><input type="date" id="f-bill_date" value="${todayISO()}"/></div>

      <div><label>Meter Rent</label><input id="f-meter_rent" type="number" step="0.01" value="0"/></div>
      <div><label>Street Light</label><input id="f-street_light" type="number" step="0.01" value="0"/></div>
      <div><label>Solid Waste</label><input id="f-solid_waste" type="number" step="0.01" value="50"/></div>
      <div><label>GST (5%, auto)</label><input id="f-gst" type="number" step="0.01" readonly/></div>
      <div><label>Previous Outstanding</label><input id="f-previous_outstanding" type="number" step="0.01" value="0"/></div>
      <div><label>Excess Payment</label><input id="f-excess_payment" type="number" step="0.01" value="0"/></div>
    </div>
    <div class="hint">GST is 5% of (lump sum amount + solid waste + street light), and recalculates automatically as those change.</div>
    <div class="form-actions">
      <button class="btn-save" id="save-bill-lumpsum">Generate lump sum bill</button>
      <button class="btn-cancel" id="cancel-bill">Cancel</button>

}
function attachBillHandlers(){
  attachSearchToolbarHandlers('search-bills','search-bills-btn','search-bills-clear',
    q=>{ billsSearchQuery=q; }, ()=>{ billsSearchQuery=''; });
  const clearFilter = document.getElementById('clear-bills-filter');
  if(clearFilter) clearFilter.addEventListener('click', ()=>{ billsHeadsUpFilter = null; render(); });
  const add = document.getElementById('add-bill');
  if(add) add.addEventListener('click', ()=>{
    const unbilled = DB.meter_readings.filter(r=>!DB.bills.some(b=>b.reading_id===r.reading_id));
    if(!unbilled.length){ showToast('No pending readings to bill'); return; }
    billFormMode='reading'; openForm='bills'; render();
  });
  const addLumpSum = document.getElementById('add-bill-lumpsum');
  if(addLumpSum) addLumpSum.addEventListener('click', ()=>{
    const eligible = DB.consumers.filter(c=>!consumerHasMeter(c.consumer_no));
    if(!eligible.length){ showToast('Every consumer already has a meter - nothing to lump-sum bill'); return; }
    billFormMode='lumpsum'; openForm='bills'; render();
  });
  const cancel = document.getElementById('cancel-bill');
  if(cancel) cancel.addEventListener('click', ()=>{ openForm=null; billFormMode='reading'; render(); });

  if(billFormMode==='lumpsum'){
    const consumerSel = document.getElementById('f-consumer_no');
    function fillLumpSumDefaults(){
      const consumerNo = consumerSel.value;
      if(!consumerNo) return;
      const others = DB.bills.filter(b=>b.consumer_no===consumerNo);
      const owed = others.reduce((s,b)=>{ const t=billTotals(b); return s + Math.max(0, t.grand_total_due - t.paid); }, 0);
      document.getElementById('f-previous_outstanding').value = money(owed);
      document.getElementById('f-excess_payment').value = money(unclaimedExcessCredit(consumerNo));
      recalcGstLumpSum();
    }
    function recalcGstLumpSum(){
      const water = +document.getElementById('f-water_charge').value || 0;
      const solidWaste = +document.getElementById('f-solid_waste').value || 0;
      const streetLight = +document.getElementById('f-street_light').value || 0;
      document.getElementById('f-gst').value = money(Math.round((water+solidWaste+streetLight)*0.05*100)/100);
    }
    if(consumerSel){ consumerSel.addEventListener('change', fillLumpSumDefaults); fillLumpSumDefaults(); }
    ['f-water_charge','f-solid_waste','f-street_light'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', recalcGstLumpSum);
    });
    const saveLumpSum = document.getElementById('save-bill-lumpsum');
    if(saveLumpSum) saveLumpSum.addEventListener('click', async ()=>{
      const consumer_no = document.getElementById('f-consumer_no').value;
      if(!consumer_no){ showToast('Select a consumer'); return; }
      const bill_date = document.getElementById('f-bill_date').value;
      const rec = {
        bill_no: nextNumericId(DB.bills, 'bill_no'),
        consumer_no,
        reading_id: '',
        lump_sum: true,
        bill_date,
        billing_month: monthName(bill_date),
        due_date: document.getElementById('f-due_date').value,
        water_charge: +document.getElementById('f-water_charge').value || 0,
        meter_rent: +document.getElementById('f-meter_rent').value || 0,
        street_light: +document.getElementById('f-street_light').value || 0,
        solid_waste: +document.getElementById('f-solid_waste').value || 0,
        gst: +document.getElementById('f-gst').value || 0,
        previous_outstanding: +document.getElementById('f-previous_outstanding').value || 0,
        excess_payment: +document.getElementById('f-excess_payment').value || 0
      };
      DB.bills.push(rec);
      await saveTable('bills');
      openForm=null; billFormMode='reading';
      showToast('Lump sum bill generated');
      render();
    });
  }

  const readingSel = document.getElementById('f-reading_id');
  function fillFromReading(){
    const readingId = readingSel.value;
    const reading = DB.meter_readings.find(r=>r.reading_id===readingId);
    const hint = document.getElementById('rate-hint');
    if(!reading){ document.getElementById('f-water_charge').value=''; return; }
    const consumerNo = meterConsumer(reading.meter_id);
    const consumer = DB.consumers.find(c=>c.consumer_no===consumerNo);
    const units = reading.current_reading - reading.previous_reading;
    const rate = consumer ? findRate(consumer.category, units) : null;
    const charge = rate ? units*rate.rate_per_unit : 0;
    document.getElementById('f-water_charge').value = money(charge);
    document.getElementById('f-bill_date').value = todayISO();
    hint.textContent = rate
      ? `${units} units × Nu. ${rate.rate_per_unit} (${consumer.category} band ${rate.unit_min}-${rate.unit_max}) = Nu. ${money(charge)}`
      : `No matching rate band found for ${consumer ? consumer.category : 'this category'} at ${units} units - check Rate Categories.`;
    // suggest previous outstanding from consumer's other unpaid bills
    const others = DB.bills.filter(b=>b.consumer_no===consumerNo);
    const owed = others.reduce((s,b)=>{ const t=billTotals(b); return s + Math.max(0, t.grand_total_due - t.paid); }, 0);
    document.getElementById('f-previous_outstanding').value = money(owed);
    // suggest any unclaimed excess payment credit from prior overpayments, so it's deducted here automatically
    document.getElementById('f-excess_payment').value = money(unclaimedExcessCredit(consumerNo));
    recalcGst();
  }
  function recalcGst(){
    const water = +document.getElementById('f-water_charge').value || 0;
    const solidWaste = +document.getElementById('f-solid_waste').value || 0;
    const streetLight = +document.getElementById('f-street_light').value || 0;
    document.getElementById('f-gst').value = money(Math.round((water+solidWaste+streetLight)*0.05*100)/100);
  }
  if(readingSel){ readingSel.addEventListener('change', fillFromReading); fillFromReading(); }
  const solidWasteInput = document.getElementById('f-solid_waste');
  const streetLightInput = document.getElementById('f-street_light');
  if(solidWasteInput) solidWasteInput.addEventListener('input', recalcGst);
  if(streetLightInput) streetLightInput.addEventListener('input', recalcGst);

  const save = document.getElementById('save-bill');
  if(save) save.addEventListener('click', async ()=>{
    const reading_id = document.getElementById('f-reading_id').value;
    const reading = DB.meter_readings.find(r=>r.reading_id===reading_id);
    if(!reading){ showToast('Select a reading'); return; }
    const consumer_no = meterConsumer(reading.meter_id);
    const bill_date = document.getElementById('f-bill_date').value;
    const rec = {
      bill_no: nextNumericId(DB.bills, 'bill_no'),
      consumer_no,
      reading_id,
      bill_date,
      billing_month: monthName(reading.reading_date),
      due_date: document.getElementById('f-due_date').value,
      water_charge: +document.getElementById('f-water_charge').value || 0,
      meter_rent: +document.getElementById('f-meter_rent').value || 0,
      street_light: +document.getElementById('f-street_light').value || 0,
      solid_waste: +document.getElementById('f-solid_waste').value || 0,
      gst: +document.getElementById('f-gst').value || 0,
      previous_outstanding: +document.getElementById('f-previous_outstanding').value || 0,
      excess_payment: +document.getElementById('f-excess_payment').value || 0
    };
    DB.bills.push(rec);
    await saveTable('bills');
    openForm=null;
    showToast('Bill generated');
    render();
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const bill_no = +btn.getAttribute('data-delete');
      const blockers = blockersForBill(bill_no);
      if(blockers.length){
        showToast(`Can't delete - remove its ${blockers.join(' and ')} first`);
        return;
      }
      askDelete(`Bill #${bill_no} will be removed. Its reading will become available to bill again.`, ()=>
        deleteRecord('bills', b=>b.bill_no===bill_no));
    });
  });
  document.querySelectorAll('[data-invoice]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      billPreviewNo = +btn.getAttribute('data-invoice');
      render();
    });
  });
  document.querySelectorAll('[data-toggle-group]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const key = row.getAttribute('data-toggle-group');
      if(expandedBillGroups.has(key)) expandedBillGroups.delete(key); else expandedBillGroups.add(key);
      render();
    });
  });
}

  return `

  </div>
  <div class="toolbar" style="justify-content:space-between;flex-wrap:wrap;">
    ${searchToolbarHtml('search-payments','search-payments-btn','search-payments-clear', paymentsSearchQuery, 'Search payments (any field)')}
    <div>${openForm==='payments' ? '' : `<button class="btn-add" id="add-payment">+ Record payment</button>`}</div>
  </div>
  ${formHtml}
  <div class="table-wrap">
    <table>
      <thead><tr><th>Payment ID</th><th>Bill No</th><th>Consumer</th><th>Amount Paid</th><th>Date</th><th>Method</th><th></th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(p=>{
          const bill = DB.bills.find(b=>b.bill_no===p.bill_no);
          return `<tr>
            <td class="num">${escapeHtml(p.payment_id)}</td>
            <td class="num">${p.bill_no}</td>
            <td>${bill ? escapeHtml(consumerName(bill.consumer_no)) : ' - '}</td>
            <td class="num">Nu. ${money(p.amount_paid)}</td>

function paymentForm(){
  const open = DB.bills.filter(b=>billTotals(b).status!=='Paid');
  const billOptions = open.map(b=>{
    const t = billTotals(b);
    return `<option value="${b.bill_no}">Bill #${b.bill_no} - ${escapeHtml(consumerName(b.consumer_no))} (Nu. ${money(t.grand_total_due-t.paid)} due)</option>`;
  }).join('');
  return `
  <div class="form-panel">
    <div class="form-grid">
      <div><label>Bill</label><select id="f-bill_no">${billOptions || '<option value="">No unpaid bills</option>'}</select></div>
      <div><label>Amount Paid</label><input id="f-amount_paid" type="number" step="0.01" min="0"/></div>
      <div><label>Payment Date</label><input type="date" id="f-payment_date" value="${todayISO()}"/></div>
      <div><label>Method</label>
        <select id="f-method"><option>Cash</option><option>Bank Transfer</option><option>Mobile Wallet</option><option>Cheque</option></select>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn-save" id="save-payment">Record payment</button>
      <button class="btn-cancel" id="cancel-payment">Cancel</button>
    </div>
  </div>`;
}
function attachPaymentHandlers(){
  attachSearchToolbarHandlers('search-payments','search-payments-btn','search-payments-clear',
    q=>{ paymentsSearchQuery=q; }, ()=>{ paymentsSearchQuery=''; });
  const add = document.getElementById('add-payment');
  if(add) add.addEventListener('click', ()=>{
    if(!DB.bills.some(b=>billTotals(b).status!=='Paid')){ showToast('No unpaid bills to record a payment against'); return; }
    openForm='payments'; render();
  });
  const cancel = document.getElementById('cancel-payment');
  if(cancel) cancel.addEventListener('click', ()=>{ openForm=null; render(); });
  const save = document.getElementById('save-payment');
  if(save) save.addEventListener('click', async ()=>{
    const bill_no = +document.getElementById('f-bill_no').value;
    const amount_paid = +document.getElementById('f-amount_paid').value;
    const payment_date = document.getElementById('f-payment_date').value;
    const method = document.getElementById('f-method').value;
    if(!bill_no || !amount_paid || amount_paid<=0 || !payment_date){ showToast('Fill in all fields'); return; }
    const bill = DB.bills.find(b=>b.bill_no===bill_no);
    const dueBefore = bill ? Math.max(0, billTotals(bill).grand_total_due - billTotals(bill).paid) : 0;
    const payment_id = nextId('P-', DB.payments, 'payment_id', 4);
    DB.payments.push({payment_id, bill_no, amount_paid, payment_date, method});
    await saveTable('payments');
    openForm=null;
    // Let the clerk know right away how this payment landed: a partial
    // payment leaves a balance that will show as previous outstanding on
    // the consumer's next bill; an overpayment becomes an excess credit
    // that gets suggested (and deducted) on the consumer's next bill.
    if(bill){
      const t = billTotals(bill);
      if(t.excess_paid>0){
        showToast(`Payment recorded - Nu. ${money(t.excess_paid)} overpaid, will be credited as excess on the next bill`);
      } else if(t.status==='Partial'){
        showToast(`Payment recorded - Nu. ${money(t.grand_total_due-t.paid)} still due, will carry to the next bill`);
      } else {
        showToast('Payment recorded');
      }
    } else {
      showToast('Payment recorded');
    }
    render();
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-delete');
      askDelete(`Payment ${id} will be removed and the bill's balance will increase again.`, ()=>
        deleteRecord('payments', p=>p.payment_id===id));
    });
  });
}

/* ===================== REPORTS ===================== */
const REPORT_TYPES = [
  {key:'billing_summary', label:'Billing Summary', desc:'Bills generated in a date range, with totals by status.'},
  {key:'collections', label:'Collections', desc:'Payments received in a date range, grouped by method.'},
  {key:'outstanding', label:'Outstanding & Overdue', desc:'Every bill not yet fully paid, as of today.'},
  {key:'consumer_statement', label:'Consumer Statement', desc:'Full bill and payment history for one consumer.'},
  {key:'revenue_by_category', label:'Revenue by Category', desc:'Billed and collected totals split by Domestic vs Commercial.'}
];
function inRange(dateStr, from, to){
  if(!dateStr) return false;
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}
function consumerCategory(no){
  const c = DB.consumers.find(c=>c.consumer_no===no);
  return c ? c.category : '';
}

function generateReport(){
  const f = reportFilters;
  if(reportType==='billing_summary'){
    let bills = DB.bills.filter(b=>inRange(b.bill_date, f.from, f.to));
    if(f.category!=='Any') bills = bills.filter(b=>consumerCategory(b.consumer_no)===f.category);
    let items = bills.map(b=>({b, t:billTotals(b)}));
    if(f.status!=='Any') items = items.filter(x=>x.t.status===f.status);
    items.sort((a,b)=>b.b.bill_no-a.b.bill_no);
    reportColumns = ['Bill No','Consumer','Category','Bill Date','Due Date','Total Bill','Penalty','Paid','Grand Total Due','Status'];
    reportRows = items.map(x=>[x.b.bill_no, consumerName(x.b.consumer_no), consumerCategory(x.b.consumer_no),
      x.b.bill_date, x.b.due_date, money(x.t.total_bill), money(x.t.penalty), money(x.t.paid), money(x.t.grand_total_due), x.t.status]);
    reportSummary = [
      ['Bills', items.length],
      ['Total Billed', 'Nu. '+money(items.reduce((s,x)=>s+x.t.grand_total_due,0))],
      ['Total Collected', 'Nu. '+money(items.reduce((s,x)=>s+x.t.paid,0))],
      ['Outstanding', 'Nu. '+money(items.reduce((s,x)=>s+Math.max(0,x.t.grand_total_due-x.t.paid),0))]
    ];
  }
  else if(reportType==='collections'){
    let payments = DB.payments.filter(p=>inRange(p.payment_date, f.from, f.to));
    payments = [...payments].sort((a,b)=>b.payment_date.localeCompare(a.payment_date));
    reportColumns = ['Payment ID','Bill No','Consumer','Date','Method','Amount'];
    reportRows = payments.map(p=>{
      const bill = DB.bills.find(b=>b.bill_no===p.bill_no);
      return [p.payment_id, p.bill_no, bill?consumerName(bill.consumer_no):' - ', p.payment_date, p.method, money(p.amount_paid)];
    });
    const byMethod = {};
    payments.forEach(p=>{ byMethod[p.method]=(byMethod[p.method]||0)+(+p.amount_paid||0); });
    reportSummary = [
      ['Payments', payments.length],
      ['Total Collected', 'Nu. '+money(payments.reduce((s,p)=>s+(+p.amount_paid||0),0))],
      ...Object.keys(byMethod).map(m=>[m, 'Nu. '+money(byMethod[m])])
    ];
  }
  else if(reportType==='outstanding'){
    let items = DB.bills.map(b=>({b, t:billTotals(b)})).filter(x=>x.t.status!=='Paid');
    if(f.category!=='Any') items = items.filter(x=>consumerCategory(x.b.consumer_no)===f.category);
    if(f.status!=='Any') items = items.filter(x=>x.t.status===f.status);
    items.sort((a,b)=>a.b.due_date.localeCompare(b.b.due_date));
    reportColumns = ['Bill No','Consumer','Category','Due Date','Days Overdue','Grand Total Due','Paid','Balance','Status'];
    reportRows = items.map(x=>{
      const daysOverdue = x.t.overdue ? Math.floor((new Date(todayISO())-new Date(x.b.due_date))/86400000) : 0;
      return [x.b.bill_no, consumerName(x.b.consumer_no), consumerCategory(x.b.consumer_no), x.b.due_date,
        daysOverdue>0?daysOverdue:' - ', money(x.t.grand_total_due), money(x.t.paid), money(x.t.grand_total_due-x.t.paid), x.t.status];
    });
    reportSummary = [
      ['Open bills', items.length],
      ['Overdue bills', items.filter(x=>x.t.overdue).length],
      ['Total balance due', 'Nu. '+money(items.reduce((s,x)=>s+(x.t.grand_total_due-x.t.paid),0))]
    ];
  }
  else if(reportType==='consumer_statement'){
    const no = f.consumer_no;
    const bills = DB.bills.filter(b=>b.consumer_no===no);
    const entries = [];
    bills.forEach(b=>{
      const t = billTotals(b);
      entries.push({date:b.bill_date, type:'Bill', ref:'Bill #'+b.bill_no, desc:b.billing_month+' billing', amount:t.total_bill+t.previous_outstanding-(+b.excess_payment||0)});
    });
    DB.payments.filter(p=>bills.some(b=>b.bill_no===p.bill_no)).forEach(p=>{
      entries.push({date:p.payment_date, type:'Payment', ref:'Bill #'+p.bill_no, desc:p.method, amount:-(+p.amount_paid||0)});
    });
    let filtered = entries.filter(e=> (!f.from || e.date>=f.from) && (!f.to || e.date<=f.to));
    filtered.sort((a,b)=>a.date.localeCompare(b.date));
    let running = 0;
    reportColumns = ['Date','Type','Reference','Description','Amount','Balance'];
    reportRows = filtered.map(e=>{ running += e.amount; return [e.date, e.type, e.ref, e.desc, money(e.amount), money(running)]; });
    const consumer = DB.consumers.find(c=>c.consumer_no===no);
    reportSummary = no ? [
      ['Consumer', consumer ? `${consumer.name} (${no})` : no],
      ['Total billed', 'Nu. '+money(entries.filter(e=>e.type==='Bill').reduce((s,e)=>s+e.amount,0))],
      ['Total paid', 'Nu. '+money(-entries.filter(e=>e.type==='Payment').reduce((s,e)=>s+e.amount,0))],
      ['Current balance', 'Nu. '+money(running)]
    ] : [['Consumer', 'Select a consumer above']];
  }
  else if(reportType==='revenue_by_category'){
    let bills = DB.bills.filter(b=>inRange(b.bill_date, f.from, f.to));
    const cats = ['Domestic','Commercial'];
    reportColumns = ['Category','Bills','Total Billed','Total Collected','Outstanding'];
    reportRows = cats.map(cat=>{
      const items = bills.filter(b=>consumerCategory(b.consumer_no)===cat).map(b=>billTotals(b));
      const billed = items.reduce((s,t)=>s+t.grand_total_due,0);
      const collected = items.reduce((s,t)=>s+t.paid,0);
      return [cat, items.length, money(billed), money(collected), money(billed-collected)];
    });
    const allItems = bills.map(b=>billTotals(b));
    reportSummary = [
      ['Bills in range', bills.length],
      ['Total Billed', 'Nu. '+money(allItems.reduce((s,t)=>s+t.grand_total_due,0))],
      ['Total Collected', 'Nu. '+money(allItems.reduce((s,t)=>s+t.paid,0))]
    ];
  }
  reportGenerated = true;
}

}
function reportFileBase(){
  const label = REPORT_TYPES.find(t=>t.key===reportType).key;
  return `${label}_${todayISO()}`;
}
function exportReportWord(){
  const title = REPORT_TYPES.find(t=>t.key===reportType).label;
  const rowsHtml = reportRows.map(r=>`<tr>${r.map(c=>`<td style="border:1px solid #ccc;padding:5px 8px;">${escapeHtml(String(c))}</td>`).join('')}</tr>`).join('');
  const summaryHtml = reportSummary.map(([k,v])=>`<p style="margin:2px 0;"><b>${escapeHtml(String(k))}:</b> ${escapeHtml(String(v))}</p>`).join('');
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${title}</title></head>
  <body style="font-family:Calibri,Arial,sans-serif;">
    <h2 style="color:#0A4F5A;margin-bottom:0;">Trashiyangtse Dzongkhag Water Billing</h2>
    <p style="color:#555;margin-top:2px;">${title} - generated ${todayISO()}</p>
    ${summaryHtml}
    <table style="border-collapse:collapse;font-size:12px;width:100%;margin-top:10px;">
      <tr>${reportColumns.map(c=>`<th style="border:1px solid #ccc;padding:5px 8px;background:#E4F1F1;text-align:left;">${escapeHtml(c)}</th>`).join('')}</tr>
      ${rowsHtml}
    </table>
  </body></html>`;
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  downloadBlob(blob, reportFileBase()+'.doc');
}
function exportReportPDF(){
  if(!window.jspdf){ showToast('PDF library still loading - try again in a moment'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation: reportColumns.length>6 ? 'landscape' : 'portrait'});
  const title = REPORT_TYPES.find(t=>t.key===reportType).label;
  doc.setFontSize(14);
  doc.setTextColor(10,79,90);
  doc.text('Trashiyangtse Dzongkhag Water Billing', 14, 16);
  doc.setFontSize(11);
  doc.setTextColor(80,80,80);
  doc.text(`${title} - generated ${todayISO()}`, 14, 23);
  let y = 30;
  doc.setFontSize(9);
  doc.setTextColor(20,40,45);
  reportSummary.forEach(([k,v])=>{ doc.text(`${k}: ${v}`, 14, y); y += 5; });
  doc.autoTable({
    startY: y+3,
    head: [reportColumns],
    body: reportRows.map(r=>r.map(c=>String(c))),
    styles: {fontSize:8, cellPadding:3},
    headStyles: {fillColor:[14,110,124]}
  });
  doc.save(reportFileBase()+'.pdf');
}
function exportReportExcel(){
  if(!window.XLSX){ showToast('Excel library still loading - try again in a moment'); return; }
  const title = REPORT_TYPES.find(t=>t.key===reportType).label;
  const summaryBlock = reportSummary.map(([k,v])=>[k, v]);
  const sheetData = [[title], [`Generated ${todayISO()}`], [], ...summaryBlock, [], reportColumns, ...reportRows];
  const ws = XLSX.utils.aoa_to_sheet(sheetData);
  ws['!cols'] = reportColumns.map(()=>({wch:16}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Report');
  XLSX.writeFile(wb, reportFileBase()+'.xlsx');
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function attachReportHandlers(){
  const typeSel = document.getElementById('rep-type');
  if(typeSel) typeSel.addEventListener('change', ()=>{
    reportType = typeSel.value; reportGenerated = false; render();
  });
  const from = document.getElementById('rep-from');

  const to = document.getElementById('rep-to');
  if(to) to.addEventListener('change', ()=>{ reportFilters.to = to.value; });
  const cat = document.getElementById('rep-category');
  if(cat) cat.addEventListener('change', ()=>{ reportFilters.category = cat.value; });
  const status = document.getElementById('rep-status');
  if(status) status.addEventListener('change', ()=>{ reportFilters.status = status.value; });
  const consumer = document.getElementById('rep-consumer');
  if(consumer) consumer.addEventListener('change', ()=>{ reportFilters.consumer_no = consumer.value; });

  const gen = document.getElementById('generate-report');
  if(gen) gen.addEventListener('click', ()=>{
    if(reportType==='consumer_statement' && !reportFilters.consumer_no){
      showToast('Select a consumer first'); return;
    }
    generateReport();
    render();
  });
  const printBtn = document.getElementById('print-report');
  if(printBtn) printBtn.addEventListener('click', ()=>{ window.print(); });
  const wordBtn = document.getElementById('export-word');
  if(wordBtn) wordBtn.addEventListener('click', exportReportWord);
  const pdfBtn = document.getElementById('export-pdf');
  if(pdfBtn) pdfBtn.addEventListener('click', exportReportPDF);
  const excelBtn = document.getElementById('export-excel');
  if(excelBtn) excelBtn.addEventListener('click', exportReportExcel);
}

function rateForm(rec){

  return `
  <div class="form-panel">
    <div class="form-grid">

      <div><label>Unit Max</label><input id="f-unit_max" type="number" value="${r.unit_max}"/></div>
      <div><label>Rate per Unit (Nu.)</label><input id="f-rate_per_unit" type="number" step="0.01" value="${r.rate_per_unit}"/></div>
    </div>
    <div class="form-actions">
      <button class="btn-save" id="save-rate">${isEdit?'Save changes':'Add band'}</button>
      <button class="btn-cancel" id="cancel-rate">Cancel</button>
    </div>
  </div>`;
}
function attachRateHandlers(){
  const add = document.getElementById('add-rate');
  if(add) add.addEventListener('click', ()=>{ openForm='rate_categories'; editingRecord=null; render(); });
  const cancel = document.getElementById('cancel-rate');
  if(cancel) cancel.addEventListener('click', ()=>{ openForm=null; editingRecord=null; render(); });
  const save = document.getElementById('save-rate');
  if(save) save.addEventListener('click', async ()=>{
    const rec = {
      rate_id: editingRecord ? editingRecord.rate_id : nextNumericId(DB.rate_categories,'rate_id'),
      category: document.getElementById('f-category').value,
      unit_min: +document.getElementById('f-unit_min').value,
      unit_max: +document.getElementById('f-unit_max').value,
      rate_per_unit: +document.getElementById('f-rate_per_unit').value
    };
    if(rec.unit_max < rec.unit_min){ showToast('Unit Max must be \u2265 Unit Min'); return; }
    if(editingRecord){
      const idx = DB.rate_categories.findIndex(r=>r.rate_id===editingRecord.rate_id);
      DB.rate_categories[idx] = rec;
    } else {
      DB.rate_categories.push(rec);
    }
    await saveTable('rate_categories');
    openForm=null; editingRecord=null;
    showToast('Rate band saved');
    render();
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingRecord = DB.rate_categories.find(r=>String(r.rate_id)===btn.getAttribute('data-edit'));
      openForm='rate_categories';
      render();
    });
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = +btn.getAttribute('data-delete');
      askDelete(`This rate band will be removed. Bills already generated keep their stored charge.`, ()=>
        deleteRecord('rate_categories', r=>r.rate_id===id));
    });
  });
}

function attachUserHandlers(){
  const add = document.getElementById('add-user');
  if(add) add.addEventListener('click', ()=>{ openForm='users'; editingRecord=null; render(); });
  const cancel = document.getElementById('cancel-user');
  if(cancel) cancel.addEventListener('click', ()=>{ openForm=null; editingRecord=null; render(); });
  const save = document.getElementById('save-user');
  if(save) save.addEventListener('click', async ()=>{
    const username = (document.getElementById('f-username').value||'').trim();
    const name = document.getElementById('f-name').value.trim();
    const password = document.getElementById('f-password').value;
    const role = document.getElementById('f-role').value;
    if(!username || !name){ showToast('Username and name are required'); return; }
    if(editingRecord){
      const idx = DB.users.findIndex(u=>u.username===editingRecord.username);
      DB.users[idx] = {username, name, role, password: password ? password : editingRecord.password};
    } else {
      if(!password){ showToast('Password is required for a new user'); return; }
      if(DB.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ showToast('That username already exists'); return; }
      DB.users.push({username, name, role, password});
    }
    await saveTable('users');
    openForm=null; editingRecord=null;
    showToast('User saved');
    render();
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingRecord = DB.users.find(u=>u.username===btn.getAttribute('data-edit'));
      openForm='users';
      render();
    });
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const username = btn.getAttribute('data-delete');
      if(username===currentUser.username){ showToast("You can't delete the account you're signed in as"); return; }
      const target = DB.users.find(u=>u.username===username);
      const remainingAdmins = DB.users.filter(u=>u.role==='admin' && u.username!==username).length;
      if(target && target.role==='admin' && remainingAdmins===0){ showToast('At least one admin account must remain'); return; }
      askDelete(`User "${escapeHtml(username)}" will lose access immediately.`, ()=>
        deleteRecord('users', u=>u.username===username));
    });
  });
}

/* ===================== BACKUP & TRANSFER (admin) ===================== */
// Exports every table as one .json file and restores it on another device.
// Data lives in each browser's own storage, so a second device only sees it
// after this file is restored there.
const BACKUP_APP_ID = 'water_billing_app';
const BACKUP_LABELS = {
  users:'Users', consumers:'Consumers', meters:'Meters', rate_categories:'Rate categories',
  meter_readings:'Meter readings', bills:'Bills', payments:'Payments', sms_notifications:'SMS notifications'
};
let pendingRestore = null; // {fileName, exportedAt, tables} - chosen file waiting for confirmation
function exportBackupFile(){
  try{
    const payload = {app:BACKUP_APP_ID, version:1, exported_at:new Date().toISOString(), tables:{}};
    TABLES.forEach(t=>{ payload.tables[t] = DB[t] || []; });
    const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'water_billing_backup_' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
    showToast('Backup file downloaded');
  }catch(e){ showToast('Could not create the backup file'); }
}
async function readBackupFile(file){
  try{
    const data = JSON.parse(await file.text());
    if(!data || data.app!==BACKUP_APP_ID || !data.tables || typeof data.tables!=='object') throw new Error('not a backup');
    for(const t of TABLES.filter(t=>t!=='sms_notifications')){
      if(!Array.isArray(data.tables[t])) throw new Error('missing '+t);
    }
    const tables = {};
    TABLES.forEach(t=>{ tables[t] = Array.isArray(data.tables[t]) ? data.tables[t] : []; });
    if(!tables.users.length) throw new Error('no users');
    pendingRestore = {fileName:file.name, exportedAt:data.exported_at||'', tables};
  }catch(e){
    pendingRestore = null;
    showToast("That file isn't a valid backup from this system");
  }
  render();
}
async function applyRestore(){
  if(!pendingRestore) return;
  const tables = pendingRestore.tables;
  pendingRestore = null;
  for(const t of TABLES){ DB[t] = tables[t]; await saveTable(t); }
  openForm = null; editingRecord = null; selectedConsumers.clear();
  const me = DB.users.find(u=>u.username===currentUser.username);
  if(!me){
    clearSession();
    currentUser = null; loginView = 'login';
    loginMsg = {type:'success', text:'Backup restored. Sign in with an account from the restored data.'};
    render();
    return;
  }
  currentUser = {username:me.username, role:me.role, name:me.name};
  if(me.role!=='admin') setActiveTab(defaultTabFor(me.role));
  render();
  showToast('Backup restored');
}
function renderBackup(){
  if(currentUser.role!=='admin') return renderLocked();
  let restoreBlock = '';
  if(pendingRestore){
    const when = pendingRestore.exportedAt ? new Date(pendingRestore.exportedAt).toLocaleString() : 'unknown date';
    restoreBlock = `
      <div class="restore-confirm">
        <h3>Replace this device's data with this backup?</h3>
        <p>${escapeHtml(pendingRestore.fileName)} &middot; exported ${escapeHtml(when)}. Everything currently saved here will be overwritten.</p>
        <ul class="restore-counts">
          ${TABLES.map(t=>`<li><span>${BACKUP_LABELS[t]}</span><span class="num">${pendingRestore.tables[t].length}</span></li>`).join('')}
        </ul>
        <div class="form-actions" style="margin-top:0;">
          <button type="button" class="btn-danger-solid" id="restore-confirm-btn">Replace data on this device</button>
          <button type="button" class="btn-cancel" id="restore-cancel-btn">Cancel</button>
        </div>
      </div>`;
  }
  return `
  <div class="page-head">
    <div><h1 class="page-title">Backup &amp; transfer to another device</h1><div class="page-desc">Move all saved records between computers or phones</div></div>
  </div>
  <div class="backup-card">
    <div class="section-title">Export all saved data</div>
    <p>Downloads every user, consumer, meter, reading, bill, payment and SMS record as one backup file. Send this file together with this system's HTML file to the other device.</p>
    <button type="button" class="btn-add" id="export-backup-btn">Export backup file</button>

    <div class="section-title" style="margin-top:30px;">Restore on this device</div>
    <p>On the other device, open this same HTML file and choose the backup file exported above to bring in all saved records. Restoring replaces the data currently saved on this device.</p>
    ${restoreBlock || `<input type="file" id="restore-file-input" accept=".json,application/json" />`}

    <hr />
    <p class="backup-tip">Tip: export a backup regularly, especially before closing the browser on a device that isn't used again. The file includes staff sign-in details, so keep it private.</p>
  </div>`;
}
function attachBackupHandlers(){
  const exp = document.getElementById('export-backup-btn');
  if(exp) exp.addEventListener('click', exportBackupFile);
  const input = document.getElementById('restore-file-input');
  if(input) input.addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(file) await readBackupFile(file);
  });
  const ok = document.getElementById('restore-confirm-btn');
  if(ok) ok.addEventListener('click', applyRestore);
  const no = document.getElementById('restore-cancel-btn');
  if(no) no.addEventListener('click', ()=>{ pendingRestore = null; render(); });
}

function renderLocked(){
  return `<div class="locked">This section is only available to admin accounts.</div>`;
}

/* ===================== boot ===================== */
async function boot(){
  DB = await loadDB();
  await restoreSession();
  render();
}
boot();

})();
