<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root{
    --ink:#132A32;
    --slate:#4B6570;
    --line:#D7E1E3;
    --paper:#F6F8F7;
    --panel:#FFFFFF;
    --teal:#0E6E7C;
    --teal-deep:#0A4F5A;
    --teal-pale:#E4F1F1;
    --amber:#B4791F;
    --amber-pale:#FBF0DD;
    --red:#B3402C;
    --red-pale:#FBEAE6;
    --green:#2E7D4F;
    --green-pale:#E8F4EC;
    --blue:#2D6CB0;
    --blue-pale:#E5EEF7;
    --gold:#B99A2E;
    --gold-pale:#FAF3DE;
    --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --disp:'Fraunces', Georgia, serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);}
  #app{min-height:600px;}
  ::selection{background:var(--teal-pale);}
  a{color:var(--teal-deep);}
  button{font-family:var(--sans);cursor:pointer;}
  input,select{font-family:var(--sans);}

  /* ---------- login (split-screen: photo panel + white sign-in panel) ---------- */
  html,body{min-height:100%;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
    background:#EFEAE1;}
  @keyframes cardIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .login-split{width:100%;max-width:1040px;min-height:600px;display:flex;background:var(--panel);
    border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(10,30,35,0.28),0 8px 22px rgba(10,30,35,0.14);
    animation:cardIn .35s ease both;}

  /* -- left: decorative photo/illustration panel -- */
  .login-left{position:relative;flex:1 1 46%;min-width:0;display:flex;flex-direction:column;
    justify-content:space-between;padding:34px;overflow:hidden;isolation:isolate;color:#fff;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,0.10) 0, transparent 40%),
      linear-gradient(155deg, #0A4F5A 0%, #0E6E7C 30%, #123840 60%, #16323B 100%);}
  .login-left::before{content:'';position:absolute;inset:0;z-index:2;opacity:.55;pointer-events:none;
    background-image:
      linear-gradient(178deg, transparent 42%, rgba(0,0,0,0.5) 100%),
      linear-gradient(155deg, rgba(10,79,90,0.55) 0%, rgba(14,110,124,0.35) 30%, rgba(18,56,64,0.55) 60%, rgba(22,50,59,0.65) 100%);
  }
  .login-left-photo{position:absolute;inset:0;z-index:1;pointer-events:none;
    background-size:cover;background-position:center;background-repeat:no-repeat;
    opacity:.6;}
  .bg-bubbles{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .bg-bubble{position:absolute;bottom:-60px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.05) 70%);
    border:1px solid rgba(255,255,255,0.16);
    animation:bubbleRise linear infinite;
  }
  @keyframes bubbleRise{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    8%{opacity:.8;}
    92%{opacity:.4;}
    100%{transform:translateY(-112vh) translateX(var(--drift,20px));opacity:0;}
  }
  .login-left-card{position:relative;z-index:4;background:rgba(10,26,30,0.5);border:1px solid rgba(255,255,255,0.16);
    border-radius:14px;padding:26px 26px 22px 26px;backdrop-filter:blur(2px);}
  .login-emblem{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);display:flex;
    align-items:center;justify-content:center;margin-bottom:18px;background:rgba(255,255,255,0.06);overflow:hidden;}
  .login-emblem img{width:100%;height:100%;object-fit:cover;}
  .login-left-title{font-family:var(--disp);font-size:26px;font-weight:600;line-height:1.22;color:#fff;}
  .login-left-rule{width:100%;height:1px;background:rgba(255,255,255,0.24);margin:16px 0;}
  .login-left-sub{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#F3E3B5;font-weight:600;}
  .login-left-quote{position:relative;z-index:4;border-left:3px solid var(--gold);
    background:rgba(10,26,30,0.42);border-radius:0 10px 10px 0;padding:16px 20px;}
  .login-left-quote p{margin:0;font-family:var(--disp);font-style:italic;font-size:15px;line-height:1.5;color:#F3EFE4;}

  /* -- right: white sign-in panel -- */
  .login-right{position:relative;flex:1 1 54%;display:flex;align-items:center;justify-content:center;
    padding:40px;min-width:0;background:linear-gradient(180deg, #FFFFFF 0%, #FBFAF6 100%);overflow:hidden;}
  .login-right::before{content:'';position:absolute;top:-60px;right:-60px;width:240px;height:240px;
    border-radius:50%;background:radial-gradient(circle, var(--teal-pale) 0%, transparent 72%);pointer-events:none;}
  .login-right::after{content:'';position:absolute;bottom:-70px;left:-50px;width:200px;height:200px;
    border-radius:50%;background:radial-gradient(circle, var(--gold-pale) 0%, transparent 72%);pointer-events:none;}
  .login-card{position:relative;z-index:1;width:100%;max-width:380px;background:#fff;
    border:1px solid var(--line);border-radius:18px;padding:36px 34px;
    box-shadow:0 18px 40px rgba(19,42,50,0.08),0 2px 8px rgba(19,42,50,0.04);}
  .login-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;
    background:var(--teal-pale);color:var(--teal-deep);font-size:10.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px;}
  .login-badge svg{width:12px;height:12px;flex-shrink:0;}
  .login-heading{font-family:var(--disp);font-size:27px;font-weight:600;color:var(--ink);margin:0 0 6px 0;}
  .login-subheading{font-size:13.5px;color:var(--slate);margin-bottom:26px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;color:var(--slate);margin-bottom:6px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:14px;background:#FBF9F5;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-pale);
    background:#fff;}
  .field-icon{position:relative;}
  .field-icon svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;
    color:var(--slate);pointer-events:none;transition:color .15s ease;}
  .field-icon input{padding-left:38px;}
  .field-icon:focus-within svg{color:var(--teal-deep);}
  .field-icon .pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;
    background:none;padding:4px;color:var(--slate);display:flex;cursor:pointer;border-radius:6px;
    transition:color .15s ease,background .15s ease;}
  .field-icon .pw-toggle:hover{color:var(--ink);background:var(--paper);}
  .field-icon.has-toggle input{padding-right:38px;}
  .btn{border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;letter-spacing:.01em;}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--ink);color:#fff;width:100%;padding:12.5px;margin-top:10px;
    box-shadow:0 6px 16px rgba(19,42,50,0.18);
    transition:background .15s ease,box-shadow .15s ease,transform .15s ease;}
  .btn-primary svg{width:16px;height:16px;transition:transform .15s ease;}
  .btn-primary:hover{background:var(--teal-deep);box-shadow:0 8px 20px rgba(10,79,90,0.28);transform:translateY(-1px);}
  .btn-primary:hover svg{transform:translateX(3px);}
  .btn-primary:active{transform:translateY(0);}
  .login-error{background:var(--red-pale);color:var(--red);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:16px;text-align:center;}
  .login-success{background:var(--green-pale);color:var(--green);font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:16px;text-align:center;}
  .login-card .hint{text-align:center;}
  .login-links{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:18px;font-size:12.5px;}
  .login-links a{display:inline-flex;align-items:center;gap:5px;color:var(--slate);text-decoration:none;
    font-weight:600;transition:color .15s ease;}
  .login-links a svg{width:13px;height:13px;flex-shrink:0;}
  .login-links a:hover{color:var(--teal-deep);}
  .login-links.back-link{justify-content:flex-start;margin-top:0;margin-bottom:18px;}
  .login-foot{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
    text-align:center;font-size:11.5px;color:var(--slate);}
  .login-foot strong{color:var(--ink);font-weight:700;}

  @media (max-width: 860px){
    .login-split{flex-direction:column;max-width:420px;min-height:0;}
    .login-left{padding:26px;gap:22px;}
    .login-left-title{font-size:21px;}
    .login-right{padding:30px 26px;}
    .login-card{padding:28px 24px;}
  }
  @media (prefers-reduced-motion: reduce){
    .login-split, .bg-bubble{animation:none !important;}
  }


  /* ---------- shell ---------- */
  .shell{display:flex;min-height:600px;}
  .sidebar{width:216px;flex-shrink:0;background:var(--teal-deep);color:#fff;display:flex;flex-direction:column;}
  .sidebar-brand{padding:22px 20px 18px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.12);}
  .sidebar-brand .brand-name{color:#fff;font-size:16px;}
  .nav{padding:14px 10px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:3px;font-size:13.5px;
    color:rgba(255,255,255,0.78);cursor:pointer;margin-bottom:2px;letter-spacing:.01em;}
  .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.14);color:#fff;font-weight:600;}
  .nav-eyebrow{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,0.4);
    padding:14px 12px 6px 12px;}
  .sidebar-user{padding:14px 18px 18px 18px;border-top:1px solid rgba(255,255,255,0.12);font-size:12.5px;}
  .sidebar-user .name{font-weight:600;color:#fff;}
  .sidebar-user .role{color:rgba(255,255,255,0.55);text-transform:capitalize;margin-bottom:10px;}
  .logout-btn{background:rgba(255,255,255,0.1);color:#fff;border:none;border-radius:3px;padding:6px 10px;font-size:12px;width:100%;}
  .logout-btn:hover{background:rgba(255,255,255,0.18);}

  .main{flex:1;padding:26px 32px 60px 32px;min-width:0;}
  .page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .page-title{font-family:var(--disp);font-size:24px;font-weight:600;color:var(--ink);margin:0;}
  .page-desc{color:var(--slate);font-size:13px;margin-top:3px;}

  /* ---------- app shell / topbar ---------- */
  .app-shell{display:flex;flex-direction:column;min-height:600px;}
  .topbar{display:flex;align-items:stretch;background:var(--teal-deep);color:#fff;flex-shrink:0;}
  .topbar-brand{background:var(--gold);color:var(--teal-deep);display:flex;align-items:center;gap:9px;
    padding:0 20px;font-family:var(--disp);font-weight:700;font-size:15px;white-space:nowrap;}
  .topbar-bar{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-width:0;}
  .topbar-bar-right{display:flex;align-items:center;gap:10px;min-width:0;}
  .storage-banner{display:none;background:var(--amber-pale);color:var(--amber);font-size:12.5px;
    padding:8px 32px;border-bottom:1px solid rgba(180,121,31,0.25);}
  .storage-banner.show{display:block;}
  .export-status{display:flex;align-items:center;gap:6px;background:var(--gold);border:none;
    color:var(--teal-deep);padding:7px 10px;border-radius:4px;font-size:12px;white-space:nowrap;
    cursor:pointer;font-weight:600;}
  .export-status:hover{background:#c9ab4a;}
  .export-status svg{flex-shrink:0;}
  .export-status-label{display:inline;}
  .burger-btn{background:transparent;border:none;color:#fff;padding:8px;border-radius:4px;display:flex;
    align-items:center;justify-content:center;}
  .burger-btn:hover{background:rgba(255,255,255,0.14);}
  .burger-btn svg{width:20px;height:20px;}
  .topbar-user-wrap{position:relative;}
  .topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 10px;border-radius:4px;
    font-size:13.5px;white-space:nowrap;}
  .topbar-user:hover{background:rgba(255,255,255,0.14);}
  .topbar-user-avatar{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .topbar-user-avatar svg{width:14px;height:14px;}
  .topbar-caret{font-size:9px;opacity:.8;}
  .topbar-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:#fff;color:var(--ink);
    border-radius:5px;box-shadow:0 8px 24px rgba(0,0,0,0.2);min-width:160px;padding:8px;z-index:40;}
  .topbar-dropdown .dd-role{font-size:11px;color:var(--slate);text-transform:capitalize;
    padding:5px 10px 9px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;}
  .topbar-dropdown button{width:100%;text-align:left;background:none;border:none;padding:8px 10px;
    font-size:13px;border-radius:3px;color:var(--ink);}
  .topbar-dropdown button:hover{background:var(--paper);}

  .topbar-welcome{display:flex;align-items:center;gap:8px;font-size:13.5px;white-space:nowrap;min-width:0;}
  .topbar-welcome .welcome-role{font-weight:700;color:var(--gold);}
  .topbar-welcome .welcome-id{background:rgba(255,255,255,0.14);border-radius:10px;padding:2px 9px;font-size:11.5px;
    letter-spacing:.02em;color:rgba(255,255,255,0.9);}
  .nav-divider{height:1px;background:rgba(255,255,255,0.12);margin:12px 4px 2px 4px;}
  .nav-action{background:none;border:none;width:100%;text-align:left;font-family:inherit;}
  .nav-action .nav-ico svg{width:17px;height:17px;}
  .sidebar.collapsed .nav-eyebrow{display:none;}
  .sidebar.collapsed{width:60px;}
  .sidebar.collapsed .nav-item{justify-content:center;padding:9px 0;}
  .sidebar.collapsed .nav-item .label{display:none;}

  .nav-item{display:flex;align-items:center;}
  .nav-ico{width:17px;height:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .nav-ico svg{width:17px;height:17px;}

  /* ---------- dashboard: stat cards ---------- */
  @keyframes dashRise{
    from{opacity:0; transform:translateY(14px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  @keyframes statIconPop{
    0%,100%{transform:scale(1) rotate(0deg);}
    50%{transform:scale(1.1) rotate(-5deg);}
  }
  .dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px;}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:15px 16px;
    display:flex;align-items:center;gap:13px;position:relative;overflow:hidden;
    animation:dashRise .5s cubic-bezier(.22,.9,.28,1) both;
    transition:box-shadow .18s ease, transform .15s ease, border-color .18s ease;}
  .dash-stats .stat-card:nth-child(1){animation-delay:.02s;}
  .dash-stats .stat-card:nth-child(2){animation-delay:.07s;}
  .dash-stats .stat-card:nth-child(3){animation-delay:.12s;}
  .dash-stats .stat-card:nth-child(4){animation-delay:.17s;}
  .dash-stats .stat-card:nth-child(5){animation-delay:.22s;}
  .dash-stats .stat-card:nth-child(6){animation-delay:.27s;}
  .stat-card{cursor:pointer;}
  .stat-card:hover{box-shadow:0 10px 24px rgba(19,42,50,0.12); transform:translateY(-3px); border-color:var(--teal);}
  .stat-card:hover .stat-icon{animation:statIconPop .55s ease;}
  .stat-icon{width:44px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 3px 8px rgba(19,42,50,0.12);}
  .stat-icon svg{width:22px;height:22px;}
  .stat-icon.c-teal{background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;}
  .stat-icon.c-red{background:linear-gradient(135deg,var(--red),#8a3120);color:#fff;}
  .stat-icon.c-blue{background:linear-gradient(135deg,var(--blue),#204d80);color:#fff;}
  .stat-icon.c-green{background:linear-gradient(135deg,var(--green),#20603b);color:#fff;}
  .stat-icon.c-gold{background:linear-gradient(135deg,var(--gold),#8a731f);color:#fff;}
  .stat-icon.c-amber{background:linear-gradient(135deg,var(--amber),#835b16);color:#fff;}
  .stat-body{min-width:0;}
  .stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);font-weight:700;}
  .stat-value{font-family:var(--mono);font-size:19px;color:var(--ink);margin-top:4px;}
  .stat-sub{font-size:11.5px;color:var(--slate);margin-top:2px;}

  /* ---------- dashboard: panels row ---------- */
  .dash-panels{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-bottom:26px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden;
    animation:dashRise .55s cubic-bezier(.22,.9,.28,1) both; transition:box-shadow .18s ease, transform .15s ease;}
  .dash-panels .panel:nth-child(1){animation-delay:.32s;}
  .dash-panels .panel:nth-child(2){animation-delay:.38s;}
  .dash-panels .panel:nth-child(3){animation-delay:.44s;}
  .panel:hover{box-shadow:0 10px 22px rgba(19,42,50,0.1); transform:translateY(-2px);}
  .panel-head{padding:13px 18px;font-weight:700;font-size:13.5px;color:var(--ink);
    border-top:3px solid var(--teal);border-bottom:1px solid var(--line);}
  .panel.accent-red .panel-head{border-top-color:var(--red);}
  .panel.accent-gold .panel-head{border-top-color:var(--gold);}
  .panel.accent-amber .panel-head{border-top-color:var(--amber);}
  .panel.flash-hl{animation:panelFlash 1.1s ease;}
  @keyframes panelFlash{0%{box-shadow:0 0 0 0 rgba(180,121,31,0.5);}100%{box-shadow:0 0 0 16px rgba(180,121,31,0);}}
  .panel-body{padding:16px 18px;}
  @media (prefers-reduced-motion: reduce){
    .stat-card, .panel, .stat-card:hover .stat-icon{animation:none !important;}
  }
  .qs-row{display:flex;gap:8px;margin-bottom:12px;}
  .qs-row:last-child{margin-bottom:0;}
  .qs-row input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
  .qs-row button{background:var(--teal-deep);color:#fff;border:none;border-radius:3px;padding:0 16px;font-size:13px;font-weight:600;}
  .qs-row button:hover{background:var(--teal);}
  .headsup-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;
    border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
  .headsup-row:last-child{border-bottom:none;}
  .headsup-row:hover{color:var(--teal-deep);}
  .count-badge{background:var(--red);color:#fff;border-radius:20px;padding:2px 11px;font-size:12px;
    font-weight:700;min-width:14px;text-align:center;display:inline-block;}
  .count-badge.ok{background:var(--green);}
  .count-badge.warn{background:var(--amber);}
  .progress-row{margin-bottom:15px;cursor:pointer;border-radius:4px;transition:background .12s ease;}
  .progress-row:hover{background:var(--teal-pale);}
  .progress-row:last-child{margin-bottom:0;}
  .recent-bill-row{cursor:pointer;}
  .recent-bill-row:hover{background:var(--teal-pale);}
  .recent-bill-row td:first-child{color:var(--teal-deep);font-weight:600;text-decoration:underline;text-decoration-style:dotted;}
  .progress-row .pr-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
  .progress-row .pr-label b{font-family:var(--mono);font-weight:600;color:var(--ink);}
  .progress-track{background:var(--line);border-radius:6px;height:7px;overflow:hidden;}
  .progress-fill{height:100%;border-radius:6px;width:0%;transition:width 1s cubic-bezier(.22,.9,.28,1);}
  .progress-fill.p-green{background:var(--green);}
  .progress-fill.p-teal{background:var(--teal);}
  .progress-fill.p-amber{background:var(--amber);}
  tr.hl-row td{background:var(--teal-pale) !important;}

  /* ---------- dashboard cards (legacy, used on Reports) ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 18px;}
  .card .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);font-weight:600;}
  .card .v{font-family:var(--mono);font-size:26px;margin-top:8px;color:var(--ink);}
  .card.warn .v{color:var(--amber);}
  .card.bad .v{color:var(--red);}
  .card.good .v{color:var(--green);}

  .section-title{font-size:13px;font-weight:700;color:var(--teal-deep);text-transform:uppercase;letter-spacing:.04em;
    margin:26px 0 10px 0;}

  /* ---------- tables ---------- */
  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);
    padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap;}
  td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--teal-pale);}
  .group-row{cursor:pointer;font-weight:600;}
  .group-row:hover{background:var(--teal-pale);}
  .detail-row td{background:var(--paper);color:var(--slate);font-size:12px;}
  .detail-row:hover td{background:var(--paper);}
  .num{font-family:var(--mono);}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill-active,.pill-paid{background:var(--green-pale);color:var(--green);}
  .pill-unpaid,.pill-inactive{background:var(--red-pale);color:var(--red);}
  .pill-partial{background:var(--amber-pale);color:var(--amber);}

  /* ---------- forms / toolbar ---------- */
  .toolbar{display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px;}
  .btn-add{background:var(--teal-deep);color:#fff;border-radius:3px;padding:8px 14px;font-size:13px;font-weight:600;}
  .btn-add:hover{background:var(--teal);}
  .btn-ghost{background:transparent;color:var(--teal-deep);border:1px solid var(--line);border-radius:3px;padding:8px 14px;font-size:13px;}
  .btn-ghost:hover{background:var(--teal-pale);}
  .form-panel{background:var(--panel);border:1px solid var(--teal);border-radius:4px;padding:18px 20px;margin-bottom:16px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 16px;}
  .form-grid label{display:block;font-size:11.5px;color:var(--slate);font-weight:600;margin-bottom:5px;}
  .form-grid input,.form-grid select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:13px;}
  .form-actions{margin-top:16px;display:flex;gap:8px;}
  .btn-save{background:var(--teal-deep);color:#fff;border-radius:3px;padding:8px 16px;font-size:13px;font-weight:600;}
  .btn-cancel{background:transparent;color:var(--slate);border:1px solid var(--line);border-radius:3px;padding:8px 16px;font-size:13px;}
  .hint{font-size:11.5px;color:var(--slate);margin-top:3px;}
  .empty{padding:34px 20px;text-align:center;color:var(--slate);font-size:13px;}
  .row-actions button{background:none;border:none;color:var(--teal-deep);font-size:12px;cursor:pointer;font-weight:600;padding:3px 6px;}
  .row-actions button:hover{text-decoration:underline;}
  .backup-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 26px 22px 26px;max-width:720px;}
  .backup-card .section-title{margin:22px 0 6px 0;}
  .backup-card p{font-size:13.5px;color:var(--slate);line-height:1.55;margin:0 0 14px 0;max-width:62ch;}
  .backup-card .btn-add{border-radius:8px;padding:10px 18px;font-size:14px;}
  .backup-card input[type=file]{display:block;width:100%;max-width:420px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13.5px;}
  .backup-card hr{border:none;border-top:1px solid var(--line);margin:22px 0 14px 0;}
  .backup-card .backup-tip{font-size:12.5px;margin:0;}
  .restore-confirm{background:var(--amber-pale);border:1px solid var(--amber);border-radius:8px;padding:14px 16px;margin-top:4px;max-width:520px;}
  .restore-confirm h3{margin:0 0 6px 0;font-size:14.5px;color:var(--ink);}
  .restore-confirm p{margin:0 0 10px 0;color:var(--ink);}
  .restore-counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px;font-size:13px;margin:0 0 12px 0;padding:0;list-style:none;}
  .restore-counts li{display:flex;justify-content:space-between;gap:10px;}
  .restore-counts .num{font-family:var(--mono);}
  .btn-danger-solid{background:var(--red);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;}
  .banner{background:var(--teal-pale);color:var(--teal-deep);border-radius:3px;padding:10px 14px;font-size:12.5px;margin-bottom:18px;}
  .banner .btn-cancel{margin-left:10px;padding:3px 10px;font-size:12px;}
  .search-term-link{color:var(--teal-deep);text-decoration:underline;text-decoration-style:dotted;cursor:pointer;}
  .search-term-link:hover{color:var(--teal);}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;
    font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.18);opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateY(0);}
  .locked{padding:60px 20px;text-align:center;color:var(--slate);}
  .loading-note{padding:40px;text-align:center;color:var(--slate);font-size:13px;}
  .row-actions .del{color:var(--red);}
  .modal-overlay{position:fixed;inset:0;background:rgba(19,42,50,0.45);display:flex;align-items:center;
    justify-content:center;z-index:60;padding:16px;}
  .modal-card{background:var(--panel);border-radius:5px;max-width:380px;width:100%;padding:22px 24px;
    box-shadow:0 8px 28px rgba(0,0,0,0.22);}
  .modal-card h3{margin:0 0 8px 0;font-family:var(--disp);font-size:17px;color:var(--ink);}
  .modal-card p{margin:0 0 18px 0;font-size:13.5px;color:var(--slate);line-height:1.5;}
  .btn-danger{background:var(--red);color:#fff;border:none;border-radius:3px;padding:8px 16px;font-size:13px;font-weight:600;}
  .btn-danger:hover{background:#96341f;}

  /* ---------- printable bill / invoice (styled like a physical utility bill) ---------- */
  .invoice-card{max-width:400px;}
  #bill-invoice{font-family:var(--mono);font-size:11.5px;color:var(--ink);position:relative;
    border:1px solid var(--ink);padding:16px 14px;background:#fff;}
  .bill-header{text-align:center;padding-bottom:8px;}
  .bill-org{font-family:var(--sans);font-size:14.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
  .bill-org-sub{font-size:10px;color:var(--slate);margin-top:2px;font-family:var(--sans);}
  .bill-doc-title{font-size:12px;font-weight:700;text-decoration:underline;margin-top:8px;font-family:var(--sans);}
  .bill-divider{border-top:1px dashed var(--ink);margin:9px 0;}
  .bill-kv{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:2px;}
  .bill-kv td{padding:2px 0;border:none;white-space:normal;vertical-align:top;}
  .bill-kv td:first-child{width:46%;color:var(--slate);}
  .bill-kv td.r{text-align:right;}
  .bill-section-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    margin:9px 0 4px 0;font-family:var(--sans);color:var(--teal-deep);}
  .bill-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:6px;}
  .bill-table td{padding:3px 0;border-bottom:1px dotted var(--line);}
  .bill-table td.r{text-align:right;}
  .bill-table tr.bill-subtotal td{font-weight:700;border-top:1px solid var(--ink);border-bottom:none;padding-top:5px;}
  .bill-total-box{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--ink);
    padding:9px 11px;margin:12px 0;font-weight:700;font-size:12.5px;font-family:var(--sans);}
  .bill-total-amt{font-family:var(--mono);font-size:15px;}
  .bill-warning{background:var(--red-pale);color:var(--red);font-size:11px;font-weight:600;
    padding:8px 10px;margin:10px 0;border:1px solid var(--red);line-height:1.5;font-family:var(--sans);}
  .bill-note{font-size:10px;color:var(--slate);line-height:1.5;margin-top:6px;font-family:var(--sans);}
  .bill-footer{text-align:center;font-size:10px;color:var(--slate);margin-top:10px;
    border-top:1px dashed var(--line);padding-top:8px;line-height:1.6;font-family:var(--sans);}

  /* ---------- tablet responsiveness ---------- */
  @media (max-width: 1024px){
    .sidebar{width:180px;}
    .main{padding:22px 20px 60px 20px;}
    .dash-panels{grid-template-columns:1fr 1fr;}
    .dash-stats{grid-template-columns:repeat(2,1fr);}
    .cards{grid-template-columns:repeat(3,1fr);}
    .invoice-card{max-width:100%;}
  }

  /* ---------- mobile responsiveness ---------- */
  @media (max-width: 760px){
    .shell{flex-direction:column;min-height:0;}
    .topbar{flex-wrap:wrap;}
    .topbar-brand{padding:9px 14px;font-size:13.5px;}
    .export-status-label{display:none;}
    .export-status{padding:7px;}
    .sidebar{width:100% !important;flex-direction:row;align-items:center;flex-wrap:nowrap;overflow-x:auto;
      -webkit-overflow-scrolling:touch;}
    .nav{display:flex;flex:none;padding:6px 8px;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .nav-item{white-space:nowrap;margin-bottom:0;padding:10px 14px;}
    .nav-item .label{display:inline !important;}
    .nav-eyebrow{display:none;}
    .main{padding:16px;}
    .page-head{flex-direction:column;align-items:flex-start;}
    .page-title{font-size:20px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .dash-stats{grid-template-columns:repeat(2,1fr);}
    .dash-panels{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
    .qs-row{flex-direction:column;align-items:stretch;}
    .qs-row button{padding:10px 16px;}
    .toolbar{flex-wrap:wrap;}
    .toolbar .btn-add,.toolbar .btn-ghost{width:100%;text-align:center;}
    .form-actions{flex-direction:column;}
    .form-actions button{width:100%;}
    .row-actions button{padding:6px 8px;}
    .table-wrap{-webkit-overflow-scrolling:touch;}
    .modal-card{padding:18px 16px;}
    /* prevent iOS Safari auto-zoom on focus, which can make a filled field look like it "reset" */
    input,select{font-size:16px !important;}
  }
  @media (max-width: 420px){
    .cards{grid-template-columns:1fr;}
    .dash-stats{grid-template-columns:1fr;}
  }

  @media print{
    body *{visibility:hidden;}
    .print-target, .print-target *{visibility:visible;}
    .print-target{position:absolute;left:0;top:0;width:100%;padding:20px;}
    .no-print{display:none !important;}
  }
</style>

/* ===================== persistence layer ===================== */
// window.storage only exists inside Claude.ai's artifact preview. Once this
// file is hosted as a normal web page (its own URL, a server, etc.) that API
// is not present, so every window.storage.get/set call used to silently
// fail (caught by try/catch) - data only ever lived in memory for that one
// page load, which is why entries from the previous session disappeared on
// the next login. AppStorage below uses window.storage when it's there, and
// otherwise falls back to the browser's localStorage automatically, so data
// is always actually written somewhere durable.
const HAS_ARTIFACT_STORAGE = (typeof window !== 'undefined') && !!window.storage && typeof window.storage.get === 'function';
let storageBackend = HAS_ARTIFACT_STORAGE ? 'artifact' : 'checking'; // 'artifact' | 'local' | 'unavailable'
function localKey(key, shared){ return 'water_billing_app::' + (shared ? 'shared' : 'private') + '::' + key; }
const AppStorage = {
  async get(key, shared){
    if(HAS_ARTIFACT_STORAGE){
      try{ return await window.storage.get(key, shared); }
      catch(e){ return null; } // key not present yet
    }
    try{
      const raw = localStorage.getItem(localKey(key, shared));
      storageBackend = 'local';
      return raw!==null ? { key, value: raw, shared: !!shared } : null;
    }catch(e){
      storageBackend = 'unavailable';
      return null;
    }
  },
  async set(key, value, shared){
    if(HAS_ARTIFACT_STORAGE){
      try{ return await window.storage.set(key, value, shared); }
      catch(e){ return null; }
    }
    try{
      localStorage.setItem(localKey(key, shared), value);
      storageBackend = 'local';
      return { key, value, shared: !!shared };
    }catch(e){
      storageBackend = 'unavailable';
      return null;
    }
  },
  async delete(key, shared){
    if(HAS_ARTIFACT_STORAGE){
      try{ return await window.storage.delete(key, shared); }
      catch(e){ return null; }
    }
    try{
      localStorage.removeItem(localKey(key, shared));
      return { key, deleted: true, shared: !!shared };
    }catch(e){ return null; }
  }
};

/* ===================== session + browser back/forward =====================
   Two things live here:
   1. The signed-in user and the tab they're on are written to AppStorage
      (private, not shared with other users) every time either changes, and
      restored on boot() - so refreshing the page reloads the same page
      instead of dropping back to the login screen.
   2. Every tab switch also gets a browser history entry (via pushState),
      and a 'popstate' listener below puts currentTab back to match when the
      person uses the browser's Back/Forward buttons, so those buttons step
      back and forward through the pages visited in this app. */
const SESSION_KEY = 'session';
async function persistSession(){
  if(!currentUser) return;
  try{ await AppStorage.set(SESSION_KEY, JSON.stringify({username: currentUser.username, tab: currentTab}), false); }
  catch(e){ /* best-effort - a failed write just means refresh won't restore state */ }
}
async function clearSession(){
  try{ await AppStorage.delete(SESSION_KEY, false); }catch(e){}
}
// Central place every tab change goes through, so history + session state
// always stay in sync with whatever page is actually showing.
function setActiveTab(tab, opts){
  currentTab = tab;
  if(typeof history !== 'undefined' && history.pushState){
    try{
      if(opts && opts.replace) history.replaceState({tab}, '', '#'+tab);
      else history.pushState({tab}, '', '#'+tab);
    }catch(e){}
  }
  persistSession();
}
if(typeof window !== 'undefined'){
  window.addEventListener('popstate', (e)=>{
    if(!currentUser) return; // nothing to route while signed out
    const items = NAV.filter(n=>n.roles.includes(currentUser.role));
    const tab = (e.state && e.state.tab) || (location.hash||'').replace('#','');
    if(!tab || !items.some(i=>i.key===tab)) return;
    currentTab = tab;
    openForm = null; editingRecord = null;
    persistSession();
    render();
  });
}
async function restoreSession(){
  try{
    const res = await AppStorage.get(SESSION_KEY, false);
    if(!res || !res.value) return;
    const sess = JSON.parse(res.value);
    const user = DB.users.find(u=>u.username===sess.username);
    if(!user){ await clearSession(); return; }
    currentUser = {username:user.username, role:user.role, name:user.name};
    const items = NAV.filter(n=>n.roles.includes(user.role));
    currentTab = sess.tab && items.some(i=>i.key===sess.tab) ? sess.tab : defaultTabFor(user.role);
    if(typeof history !== 'undefined' && history.replaceState){
      try{ history.replaceState({tab: currentTab}, '', '#'+currentTab); }catch(e){}
    }
  }catch(e){ /* no valid session - normal login screen shows */ }
}

/* ===================== storage helpers ===================== */
async function loadDB(){
  const db = {};
  for(const t of TABLES){
    try{
      const res = await AppStorage.get(t, true);
      db[t] = res && res.value ? JSON.parse(res.value) : null;
    }catch(e){
      db[t] = null;
    }
    if(!db[t]){
      db[t] = SEED[t];
      const saved = await AppStorage.set(t, JSON.stringify(db[t]), true);
      if(!saved) storageBackend = 'unavailable';
    }
  }
  return db;
}

  const r = await AppStorage.set(name, JSON.stringify(DB[name]), true);
  if(!r){
    storageBackend = 'unavailable';
    showToast('Could not save - your browser storage is blocked. Use "Backup & Transfer" to avoid losing changes.');
  }
}

// Which field on each table is its unique identifier - used to decide whether
// an imported row updates an existing record or is inserted as a new one.
const PRIMARY_KEYS = {
  users:'username', consumers:'consumer_no', meters:'meter_id', rate_categories:'rate_id',
  meter_readings:'reading_id', bills:'bill_no', payments:'payment_id', sms_notifications:'id'
};
// Fields that must be stored as numbers rather than text.
const NUMERIC_FIELDS = {
  rate_categories:['rate_id','unit_min','unit_max','rate_per_unit'],
  meter_readings:['previous_reading','current_reading'],
  bills:['bill_no','water_charge','meter_rent','street_light','solid_waste','previous_outstanding','excess_payment'],
  payments:['amount_paid']
};
function normalizeHeader(h){ return String(h==null?'':h).trim().toLowerCase().replace(/[\s\-]+/g,'_'); }
// A block of parsed data (one Excel sheet, one Word table, one PDF page, or a
// whole CSV/TSV/TXT file) is only accepted if its header row is an EXACT
// match - same columns, no more, no fewer - for one of the tables below.
// This is what "match the columns exactly to the index" means in practice:
// the uploaded headers must line up one-for-one with a table's field list.
function matchTableForHeaders(headers){
  const normSet = new Set(headers.map(normalizeHeader).filter(Boolean));
  return EXPORT_SHEETS.find(sheetDef=>{
    const expected = new Set(sheetDef.columns.map(normalizeHeader));
    return expected.size === normSet.size && [...expected].every(c=>normSet.has(c));
  }) || null;
}
function coerceImportValue(table, field, raw){
  const v = (raw===undefined || raw===null) ? '' : String(raw).trim();
  if(NUMERIC_FIELDS[table] && NUMERIC_FIELDS[table].includes(field)){
    const n = parseFloat(v.replace(/,/g,''));
    return isNaN(n) ? 0 : n;
  }
  return v;
}
// Rebuilds a row (whose header spelling/casing may not exactly match) into a
// clean record keyed by the table's real field names.
function buildImportRecord(sheetDef, row){
  const keyByNorm = {};
  Object.keys(row).forEach(k=>{ keyByNorm[normalizeHeader(k)] = k; });
  const rec = {};
  sheetDef.columns.forEach(col=>{
    const rawKey = keyByNorm[normalizeHeader(col)];
    rec[col] = coerceImportValue(sheetDef.table, col, rawKey!==undefined ? row[rawKey] : '');
  });
  return rec;
}
async function parseSpreadsheetFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  return wb.SheetNames.map(name=>({
    name,
    rows: XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:''})
  })).filter(s=>s.rows.length);
}
/* ---- bulk "consumer + meter" upload, offered right from the Consumers page ----
   This is distinct from the general multi-table Import in the top bar (which
   expects a separate sheet per table). Here a single sheet, one row per
   consumer, can optionally include that consumer's meter number too, so both
   the consumer and its meter get created together in one upload. */
const CONSUMER_METER_IMPORT_COLUMNS = ['consumer_no','name','category','ward','mobile','status','meter_number'];

// Finds the sheet whose header row is an EXACT match (same columns, no more,
// no fewer, case/spacing-insensitive) for the required template above.
async function parseConsumerMeterFile(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  if(!['xlsx','xls','csv'].includes(ext)) throw new Error('Please upload an Excel (.xlsx/.xls) or CSV file');
  const sheets = await parseSpreadsheetFile(file);
  const expected = new Set(CONSUMER_METER_IMPORT_COLUMNS.map(normalizeHeader));
  const sheet = sheets.find(s=>{
    if(!s.rows.length) return false;
    const norm = new Set(Object.keys(s.rows[0]).map(normalizeHeader).filter(Boolean));
    return expected.size===norm.size && [...expected].every(c=>norm.has(c));
  });
  if(!sheet) throw new Error(`Columns must be exactly: ${CONSUMER_METER_IMPORT_COLUMNS.join(', ')}`);
  return sheet.rows;
}
// Adds/updates one consumer per row, and - if a meter_number is given and the
// consumer doesn't already have an active meter or that number isn't already
// in use - creates the meter alongside it with an auto-generated Meter ID.
async function importConsumersWithMeters(rows){
  let addedConsumers=0, updatedConsumers=0, addedMeters=0, skippedMeters=0, skippedRows=0;
  rows.forEach(row=>{
    const keyByNorm = {};
    Object.keys(row).forEach(k=>{ keyByNorm[normalizeHeader(k)] = k; });
    const get = col => { const k = keyByNorm[normalizeHeader(col)]; return k!==undefined ? String(row[k]==null?'':row[k]).trim() : ''; };
    const consumer_no = get('consumer_no');
    const name = get('name');
    if(!consumer_no || !name){ skippedRows++; return; }
    const fields = {
      consumer_no, name,
      category: get('category') || 'Domestic',
      ward: get('ward'),
      mobile: get('mobile'),
      status: get('status') || 'Active'
    };
    const existing = DB.consumers.find(c=>c.consumer_no===consumer_no);
    if(existing){
      Object.assign(existing, fields);
      updatedConsumers++;
    } else {
      DB.consumers.push({...fields, supply_status:'Connected'});
      addedConsumers++;
    }
    const meterNumber = get('meter_number');
    if(meterNumber){
      const hasActiveMeter = DB.meters.some(m=>m.consumer_no===consumer_no && m.status==='Active');
      const numberTaken = DB.meters.some(m=>(m.meter_number||'').trim().toLowerCase()===meterNumber.toLowerCase());
      if(hasActiveMeter || numberTaken){
        skippedMeters++;
      } else {
        DB.meters.push({meter_id: nextId('M-', DB.meters, 'meter_id', 3), consumer_no, meter_number: meterNumber, status:'Active'});
        addedMeters++;
      }
    }
  });
  await Promise.all(['consumers','meters'].map(t=>saveTable(t)));
  const parts = [];
  if(addedConsumers) parts.push(`${addedConsumers} consumer${addedConsumers===1?'':'s'} added`);
  if(updatedConsumers) parts.push(`${updatedConsumers} updated`);
  if(addedMeters) parts.push(`${addedMeters} meter${addedMeters===1?'':'s'} added`);
  if(skippedMeters) parts.push(`${skippedMeters} meter${skippedMeters===1?'':'s'} skipped (already exists)`);
  if(skippedRows) parts.push(`${skippedRows} row${skippedRows===1?'':'s'} skipped (missing Consumer No/Name)`);
  showToast(parts.length ? `Import complete - ${parts.join(', ')}` : 'No rows imported');
  editingRecord=null;
  render();
}
async function handleConsumerMeterFile(file){
  try{
    const rows = await parseConsumerMeterFile(file);
    if(!rows.length){ showToast('No rows found in that file'); return; }

  }catch(e){
    showToast('Could not import that file: ' + (e && e.message ? e.message : e));
  }
}
async function parseDelimitedFile(file){
  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(delim).map(h=>h.trim());
  const rows = lines.slice(1).map(line=>{
    const cells = line.split(delim);
    const row = {};
    headers.forEach((h,i)=>{ row[h] = (cells[i]!==undefined ? cells[i] : '').trim(); });
    return row;
  });
  return [{name:file.name, rows}];
}
async function parseDocxFile(file){
  if(typeof mammoth==='undefined') throw new Error('Word import library did not load - check your connection');
  const buf = await file.arrayBuffer();
  const result = await mammoth.convertToHtml({arrayBuffer:buf});
  const doc = new DOMParser().parseFromString(result.value, 'text/html');
  const tables = Array.from(doc.querySelectorAll('table'));
  return tables.map((table, idx)=>{
    const trs = Array.from(table.querySelectorAll('tr'));
    if(!trs.length) return {name:`Table ${idx+1}`, rows:[]};
    const headers = Array.from(trs[0].querySelectorAll('th,td')).map(td=>td.textContent.trim());
    const rows = trs.slice(1).map(tr=>{
      const cells = Array.from(tr.querySelectorAll('td,th')).map(td=>td.textContent.trim());
      const row = {};
      headers.forEach((h,i)=>{ row[h] = cells[i]!==undefined ? cells[i] : ''; });
      return row;
    });
    return {name:`Table ${idx+1}`, rows};
  }).filter(s=>s.rows.length);
}
// PDFs have no real table structure, so this reconstructs rows by grouping
// text items that share a line (same y-position) and splitting columns on
// runs of 2+ spaces - a best-effort match for simple, evenly-spaced tables.
async function parsePdfFile(file){
  if(typeof pdfjsLib==='undefined') throw new Error('PDF import library did not load - check your connection');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const sheets = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const lines = {};
    content.items.forEach(item=>{
      const y = Math.round(item.transform[5]);
      (lines[y] = lines[y] || []).push(item);
    });
    const textLines = Object.keys(lines).map(Number).sort((a,b)=>b-a)
      .map(y=> lines[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim())
      .filter(l=>l.length);
    if(textLines.length < 2) continue;
    const splitRow = l => l.split(/\s{2,}|\t/).map(s=>s.trim()).filter(Boolean);
    const headers = splitRow(textLines[0]);
    if(headers.length < 2) continue;
    const rows = textLines.slice(1).map(line=>{
      const cells = splitRow(line);
      const row = {};
      headers.forEach((h,i)=>{ row[h] = cells[i]!==undefined ? cells[i] : ''; });
      return row;
    }).filter(r=>Object.values(r).some(v=>v!==''));
    if(rows.length) sheets.push({name:`Page ${p}`, rows});
  }
  return sheets;
}
async function importSheetsIntoDB(sheets){
  const summary = [];
  const unmatched = [];
  const affectedTables = new Set();
  sheets.forEach(sheet=>{
    if(!sheet.rows.length) return;
    const sheetDef = matchTableForHeaders(Object.keys(sheet.rows[0]));
    if(!sheetDef){ unmatched.push(sheet.name); return; }
    const pk = PRIMARY_KEYS[sheetDef.table];
    let added=0, updated=0, skipped=0;
    sheet.rows.forEach(row=>{
      const rec = buildImportRecord(sheetDef, row);
      if(rec[pk]===''||rec[pk]===undefined||rec[pk]===null){ skipped++; return; }
      const list = DB[sheetDef.table];
      const idx = list.findIndex(r=>String(r[pk])===String(rec[pk]));
      if(idx>=0) list[idx] = rec; else list.push(rec);
      if(idx>=0) updated++; else added++;
    });
    if(added || updated){
      affectedTables.add(sheetDef.table);
      summary.push(`${sheetDef.title}: +${added}${updated?` / ~${updated}`:''}`);
    } else if(skipped){
      unmatched.push(`${sheet.name} (missing ${pk})`);
    }
  });
  for(const t of affectedTables) await saveTable(t);
  if(!summary.length){
    showToast(unmatched.length ? `No rows imported - couldn't match columns in: ${unmatched.join(', ')}` : 'No tabular data found in that file');
  } else {
    showToast(`Imported - ${summary.join(', ')}${unmatched.length ? ` (skipped: ${unmatched.join(', ')})` : ''}`);
  }
  render();
}
async function handleImportFile(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  try{
    let sheets;
    if(['xlsx','xls','csv'].includes(ext)) sheets = await parseSpreadsheetFile(file);
    else if(ext==='docx') sheets = await parseDocxFile(file);
    else if(ext==='pdf') sheets = await parsePdfFile(file);
    else if(['txt','tsv'].includes(ext)) sheets = await parseDelimitedFile(file);
    else { showToast(`Unsupported file type ".${ext}" - use Excel, Word, PDF, CSV, or TSV/TXT`); return; }
    if(!sheets || !sheets.length){ showToast('No tabular data found in that file'); return; }
    await importSheetsIntoDB(sheets);
  }catch(e){
    showToast('Could not read that file: ' + (e && e.message ? e.message : e));
  }
}

function exportDataToExcel(){
  if(typeof XLSX==='undefined'){ showToast('Excel export library did not load - check your connection'); return; }
  if(!DB){ showToast('No data loaded yet'); return; }
  try{
    const consumerName = no => { const c = DB.consumers.find(c=>c.consumer_no===no); return c ? c.name : ''; };
    const thisMonth = todayISO().slice(0,7);

    // 1. Unpaid / overdue bills, with what is still outstanding on each
    const unpaid = DB.bills.map(b=>({b, t:billTotals(b)})).filter(x=>x.t.status!=='Paid')
      .sort((x,y)=>x.b.bill_no-y.b.bill_no);
    const unpaidCols = ['Bill No','Consumer No','Consumer Name','Billing Month','Due Date','Status','Bill Amount','GST','Previous Outstanding','Penalty','Total Due','Paid','Outstanding'];
    const unpaidRows = unpaid.map(({b,t})=>({
      'Bill No':b.bill_no, 'Consumer No':b.consumer_no, 'Consumer Name':consumerName(b.consumer_no),
      'Billing Month':b.billing_month, 'Due Date':b.due_date,
      'Status': t.overdue ? 'Overdue' : t.status,
      'Bill Amount':+money(t.total_bill), 'GST':+money(t.gst), 'Previous Outstanding':+money(t.previous_outstanding),
      'Penalty':+money(t.penalty), 'Total Due':+money(t.grand_total_due), 'Paid':+money(t.paid),
      'Outstanding':+money(t.grand_total_due - t.paid)
    }));
    const outstandingTotal = unpaid.reduce((sum,x)=>sum + (x.t.grand_total_due - x.t.paid), 0);
    const overdueCount = unpaid.filter(x=>x.t.overdue).length;
    if(unpaidRows.length) unpaidRows.push({'Bill No':'TOTAL','Outstanding':+money(outstandingTotal)});

    // 2. Payments received this month
    const collected = DB.payments.filter(p=>String(p.payment_date||'').slice(0,7)===thisMonth)
      .sort((x,y)=>String(x.payment_date).localeCompare(String(y.payment_date)));
    const collectedCols = ['Payment ID','Payment Date','Bill No','Consumer No','Consumer Name','Method','Amount Paid'];
    const collectedRows = collected.map(p=>{
      const bill = DB.bills.find(b=>b.bill_no===p.bill_no);
      return {'Payment ID':p.payment_id, 'Payment Date':p.payment_date, 'Bill No':p.bill_no,
        'Consumer No':bill?bill.consumer_no:'', 'Consumer Name':bill?consumerName(bill.consumer_no):'',
        'Method':p.method||'', 'Amount Paid':+money(+p.amount_paid||0)};
    });
    const collectedTotal = collected.reduce((sum,p)=>sum+(+p.amount_paid||0), 0);
    if(collectedRows.length) collectedRows.push({'Payment ID':'TOTAL','Amount Paid':+money(collectedTotal)});

    // 3. Summary (same figures as the Dashboard cards)
    const summaryRows = [
      {'Item':'Report date', 'Value':todayISO()},
      {'Item':'Unpaid bills', 'Value':unpaid.length},
      {'Item':'Overdue bills', 'Value':overdueCount},
      {'Item':'Outstanding (Nu.)', 'Value':+money(outstandingTotal)},
      {'Item':'Collected this month - '+monthName(thisMonth+'-01')+' (Nu.)', 'Value':+money(collectedTotal)}
    ];

    const wb = XLSX.utils.book_new();
    const addSheet = (rows, cols, title, widths)=>{
      const ws = XLSX.utils.json_to_sheet(rows, {header:cols});
      ws['!cols'] = cols.map((c,i)=>({wch: widths ? widths[i] : Math.max(14, c.length+2)}));
      XLSX.utils.book_append_sheet(wb, ws, title);
    };
    addSheet(summaryRows, ['Item','Value'], 'Summary', [46,18]);
    addSheet(unpaidRows, unpaidCols, 'Unpaid & Overdue Bills');
    addSheet(collectedRows, collectedCols, 'Collected This Month');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    XLSX.writeFile(wb, `water-billing-report-${stamp}.xlsx`);
    showToast('Excel report saved to your Downloads folder');
  }catch(e){
    showToast('Could not build the Excel file');
  }
}

/* ===================== domain helpers ===================== */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function money(n){ return (Math.round((n+Number.EPSILON)*100)/100).toFixed(2); }
function monthName(iso){
  return new Date(iso+'T00:00:00').toLocaleString('en-US',{month:'long'});
}
function consumerName(no){
  const c = DB.consumers.find(c=>c.consumer_no===no);
  return c ? c.name : no;
}
function meterConsumer(meterId){
  const m = DB.meters.find(m=>m.meter_id===meterId);
  return m ? m.consumer_no : '';
}
function billMeterNumber(b){
  const reading = DB.meter_readings.find(r=>r.reading_id===b.reading_id);
  const meter = reading ? DB.meters.find(m=>m.meter_id===reading.meter_id) : null;
  return meter ? meter.meter_number : (reading ? reading.meter_id : 'Nil');
}
// Whether a consumer currently has an active meter attached. Consumers with
// no active meter can only be billed a lump sum amount (no per-unit reading
// to bill against), and are shown with meter no. "Nil" throughout the app.
function consumerHasMeter(consumerNo){
  return DB.meters.some(m=>m.consumer_no===consumerNo && m.status==='Active');
}
function consumerMeterNumber(consumerNo){
  const m = DB.meters.find(m=>m.consumer_no===consumerNo && m.status==='Active');
  return m ? m.meter_number : 'Nil';
}
/* Groups bills that share the same consumer_no AND the same meter_no into a
   single entry, so the same individual is shown once with the combined
   amount still owed against them, instead of one row per bill. */
function groupBillsByConsumerMeter(filterFn){
  const groups = {};
  const source = filterFn ? DB.bills.filter(filterFn) : DB.bills;
  source.forEach(b=>{
    const meterNo = billMeterNumber(b);
    const key = b.consumer_no + '||' + meterNo;
    if(!groups[key]) groups[key] = {key, consumer_no:b.consumer_no, meter_number:meterNo, bills:[]};
    groups[key].bills.push(b);
  });
  const list = Object.values(groups);
  list.forEach(g=>g.bills.sort((a,b)=>b.bill_no-a.bill_no));
  list.sort((a,b)=>b.bills[0].bill_no - a.bills[0].bill_no);
  return list;
}
function findRate(category, units){
  return DB.rate_categories.find(r=>r.category===category && units>=r.unit_min && units<=r.unit_max);
}
// How much overpayment credit a consumer has sitting unused across their
// other bills. "Generated" is money paid beyond what was actually due on a
// bill (billTotals().excess_paid); "claimed" is however much of that has
// already been assigned to some bill's own Excess Payment field. What's left
// over is available to suggest on the next bill so the overpayment actually
// gets deducted there instead of the clerk having to notice and type it in.
function unclaimedExcessCredit(consumerNo, excludeBillNo){
  const bills = DB.bills.filter(b=>b.consumer_no===consumerNo && b.bill_no!==excludeBillNo);
  let generated = 0, claimed = 0;
  bills.forEach(b=>{
    generated += billTotals(b).excess_paid;
    claimed += (+b.excess_payment||0);
  });
  return Math.max(0, Math.round((generated-claimed)*100)/100);
}
/* "previous_outstanding" is recorded on a bill as a snapshot (the amount
   still owed on the consumer's earlier bills at the moment this bill was
   created). If those earlier bills are later paid off - even via a payment
   recorded directly against them, not against this bill - that snapshot
   used to stay frozen forever, so a bill kept showing old debt as due even
   after it had actually been paid. This recomputes it live every time:
   it can only ever be as large as what was originally recorded (so a bill
   never picks up new debt created after it), but it shrinks in step with
   whatever the consumer's earlier bills still actually owe right now, down
   to zero once those are fully settled. */
function livePreviousOutstanding(b){
  const recorded = +b.previous_outstanding || 0;
  if(recorded <= 0) return 0;
  const stillOwedOnEarlierBills = DB.bills
    .filter(x=>x.consumer_no===b.consumer_no && x.bill_no < b.bill_no)
    .reduce((s,x)=>{
      const t = billTotals(x); // earlier bill_no, so this terminates
      return s + Math.max(0, t.grand_total_due - t.paid);
    }, 0);
  return Math.min(recorded, stillOwedOnEarlierBills);
}
/* Breaks the previous_outstanding snapshot on a bill down into the actual
   earlier bills (for the same consumer) that make it up, so a bill can be
   presented as a single consolidated statement listing every still-unpaid
   prior bill instead of just one lump "previous outstanding" figure. Mirrors
   livePreviousOutstanding's logic (only earlier bill_nos, live amounts) but
   returns the line items instead of just the total. */
function previousOutstandingBreakdown(b){
  const recorded = +b.previous_outstanding || 0;
  if(recorded <= 0) return [];
  return DB.bills
    .filter(x=>x.consumer_no===b.consumer_no && x.bill_no < b.bill_no)
    .sort((a,c)=>a.bill_no-c.bill_no)
    .map(x=>{
      const t = billTotals(x);
      return {bill_no:x.bill_no, billing_month:x.billing_month, due_date:x.due_date,
              outstanding: Math.max(0, t.grand_total_due - t.paid)};
    })
    .filter(x=>x.outstanding>0);
}
function billTotals(b){
  const total_bill = (+b.water_charge||0)+(+b.meter_rent||0)+(+b.street_light||0)+(+b.solid_waste||0);
  const paid = DB.payments.filter(p=>p.bill_no===b.bill_no).reduce((s,p)=>s+(+p.amount_paid||0),0);
  // 5% GST, charged only on water charge + solid waste + street light (meter rent excluded)
  const gstable_amount = (+b.water_charge||0)+(+b.solid_waste||0)+(+b.street_light||0);
  const gst = Math.round(gstable_amount*0.05*100)/100;
  const previous_outstanding = livePreviousOutstanding(b);
  const baseDue = total_bill + gst + previous_outstanding - (+b.excess_payment||0);
  const overdue = (todayISO() > b.due_date) && paid < baseDue;
  const penalty = overdue ? Math.round(total_bill*0.02*100)/100 : 0; // 2% penalty on the bill amount once overdue
  const grand_total_due = baseDue + penalty;
  const excess_paid = paid > grand_total_due ? Math.round((paid-grand_total_due)*100)/100 : 0; // amount paid over and above what was actually due
  const excess_credited = Math.round(((+b.excess_payment||0)+excess_paid)*100)/100; // total excess credited to this bill (prior credit + any new overpayment)
  let status = 'Unpaid';
  if(paid >= grand_total_due && grand_total_due>0) status = 'Paid';
  else if(paid>0) status = 'Partial';
  else if(grand_total_due<=0) status = 'Paid';
  return {total_bill, paid, penalty, grand_total_due, status, overdue, gst, gstable_amount, excess_paid, excess_credited, previous_outstanding};
}
/* ---- disconnection tracking ----
   Counts how many of a consumer's most recent bills, in a row, are still
   not fully paid (Unpaid or Partial), starting from the latest bill and
   stopping as soon as a Paid bill is hit. 3 or more in a row means the
   consumer has gone 3 consecutive billing months without clearing dues,
   which is the disconnection trigger. */
function consecutiveUnpaidBillCount(consumerNo){
  const bills = DB.bills.filter(b=>b.consumer_no===consumerNo).slice().sort((a,b)=>b.bill_no-a.bill_no);
  let n = 0;
  for(const b of bills){
    if(billTotals(b).status!=='Paid') n++; else break;
  }
  return n;
}
function consumersDueForDisconnection(){
  return DB.consumers.filter(c=>consecutiveUnpaidBillCount(c.consumer_no)>=3);
}
async function sendDisconnectionSms(consumerNo){
  const c = DB.consumers.find(c=>c.consumer_no===consumerNo);
  if(!c) return;
  if(!c.mobile){ showToast('No mobile number on file - add one on the Consumers page first'); return; }
  const message = `Dear ${c.name}, your water bill has been unpaid for ${consecutiveUnpaidBillCount(consumerNo)} consecutive months. Please clear dues immediately to avoid disconnection of water supply. - Trashiyangtse Dzongkhag`;
  const rec = {id: nextId('SMS-', DB.sms_notifications, 'id', 4), consumer_no: consumerNo, mobile: c.mobile, message, sent_date: todayISO()};
  DB.sms_notifications.push(rec);
  await saveTable('sms_notifications');
  showToast(`Disconnection SMS sent to ${c.mobile}`);
  render();
}
async function toggleSupplyStatus(consumerNo){
  const c = DB.consumers.find(c=>c.consumer_no===consumerNo);
  if(!c) return;
  c.supply_status = c.supply_status==='Disconnected' ? 'Connected' : 'Disconnected';
  await saveTable('consumers');
  showToast(c.supply_status==='Disconnected' ? `Water supply disconnected for ${c.name}` : `Water supply reconnected for ${c.name}`);
  render();
}
function nextId(prefix, list, field, pad){
  let max = 0;
  list.forEach(r=>{
    const v = String(r[field]||'');
    const m = v.match(/(\d+)$/);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  const n = max+1;
  return prefix + String(n).padStart(pad||3,'0');
}
function nextNumericId(list, field){
  let max = 0;
  list.forEach(r=>{ if(+r[field] > max) max = +r[field]; });
  return max+1;
}

/* ---- delete guards: block a delete that would orphan dependent records ---- */
// Deleting a consumer cascades instead of being blocked: this walks the
// consumer -> meters -> meter readings -> bills -> payments chain and
// collects every dependent record so they can all be removed together.
function collectConsumerCascade(no){
  const meters = DB.meters.filter(m=>m.consumer_no===no);
  const meterIds = meters.map(m=>m.meter_id);
  const readings = DB.meter_readings.filter(r=>meterIds.includes(r.meter_id));
  const readingIds = readings.map(r=>r.reading_id);
  const bills = DB.bills.filter(b=>b.consumer_no===no || readingIds.includes(b.reading_id));
  const billNos = bills.map(b=>b.bill_no);
  const payments = DB.payments.filter(p=>billNos.includes(p.bill_no));
  return {meters, readings, bills, payments};
}
async function deleteConsumerCascade(no){
  const {meters, readings, bills, payments} = collectConsumerCascade(no);
  const meterIds = meters.map(m=>m.meter_id);
  const readingIds = readings.map(r=>r.reading_id);
  const billNos = bills.map(b=>b.bill_no);
  DB.payments = DB.payments.filter(p=>!billNos.includes(p.bill_no));
  DB.bills = DB.bills.filter(b=>!(b.consumer_no===no || readingIds.includes(b.reading_id)));
  DB.meter_readings = DB.meter_readings.filter(r=>!meterIds.includes(r.meter_id));
  DB.meters = DB.meters.filter(m=>m.consumer_no!==no);
  DB.consumers = DB.consumers.filter(c=>c.consumer_no!==no);
  await Promise.all(['payments','bills','meter_readings','meters','consumers'].map(t=>saveTable(t)));
  showToast('Consumer and all related records deleted');
}
// Same cascade as collectConsumerCascade/deleteConsumerCascade, but for a set
// of consumer_nos at once (bulk delete from the Consumers page).
function collectConsumersCascade(nos){
  const idSet = new Set(nos);
  const meters = DB.meters.filter(m=>idSet.has(m.consumer_no));
  const meterIds = meters.map(m=>m.meter_id);
  const readings = DB.meter_readings.filter(r=>meterIds.includes(r.meter_id));
  const readingIds = readings.map(r=>r.reading_id);
  const bills = DB.bills.filter(b=>idSet.has(b.consumer_no) || readingIds.includes(b.reading_id));
  const billNos = bills.map(b=>b.bill_no);
  const payments = DB.payments.filter(p=>billNos.includes(p.bill_no));
  return {meters, readings, bills, payments};
}
async function deleteConsumersCascade(nos){
  const idSet = new Set(nos);
  const {meters, readings, bills, payments} = collectConsumersCascade(nos);
  const meterIds = meters.map(m=>m.meter_id);
  const readingIds = readings.map(r=>r.reading_id);
  const billNos = bills.map(b=>b.bill_no);
  DB.payments = DB.payments.filter(p=>!billNos.includes(p.bill_no));
  DB.bills = DB.bills.filter(b=>!(idSet.has(b.consumer_no) || readingIds.includes(b.reading_id)));
  DB.meter_readings = DB.meter_readings.filter(r=>!meterIds.includes(r.meter_id));
  DB.meters = DB.meters.filter(m=>!idSet.has(m.consumer_no));
  DB.consumers = DB.consumers.filter(c=>!idSet.has(c.consumer_no));
  await Promise.all(['payments','bills','meter_readings','meters','consumers'].map(t=>saveTable(t)));
  showToast(`${idSet.size} consumer${idSet.size===1?'':'s'} and all related records deleted`);
}
function blockersForMeter(id){
  const reasons = [];
  if(DB.meter_readings.some(r=>r.meter_id===id)) reasons.push('meter readings');
  return reasons;
}
/* If this meter's previous reading was billed and that bill isn't fully paid,
   returns the outstanding amount to surface alongside the next reading. */
function outstandingCarriedForReading(r){
  const priorReadings = DB.meter_readings
    .filter(x=>x.meter_id===r.meter_id && x.reading_date < r.reading_date)
    .sort((a,b)=>b.reading_date.localeCompare(a.reading_date));
  const prior = priorReadings[0];
  if(!prior) return 0;
  const bill = DB.bills.find(b=>b.reading_id===prior.reading_id);
  if(!bill) return 0;
  const t = billTotals(bill);
  const out = t.grand_total_due - t.paid;
  return out > 0 ? out : 0;
}

function blockersForReading(id){
  const reasons = [];
  if(DB.bills.some(b=>b.reading_id===id)) reasons.push('a bill');
  return reasons;
}
function blockersForBill(no){
  const reasons = [];
  if(DB.payments.some(p=>p.bill_no===no)) reasons.push('payments');
  return reasons;
}
async function deleteRecord(table, predicate){
  DB[table] = DB[table].filter(r=>!predicate(r));
  await saveTable(table);
  showToast('Deleted');
}

function attachLoginHandlers(){
  const loginForm = document.getElementById('login-form');
  if(loginForm) loginForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const u = document.getElementById('li-user').value;
    const p = document.getElementById('li-pass').value;
    const user = tryLogin(u,p);
    if(user){
      currentUser = {username:user.username, role:user.role, name:user.name};
      setActiveTab(defaultTabFor(user.role), {replace:true});
      loginMsg = null; loginView = 'login';
      render();
      showToast(`Welcome ${roleLabel(user.role)} (ID: ${user.username})`);
    } else {
      loginMsg = {type:'error', text:'Incorrect username or password.'};
      render();
    }
  });

  const goSignup = document.getElementById('go-signup');
  if(goSignup) goSignup.addEventListener('click', (e)=>{ e.preventDefault(); loginView='signup'; loginMsg=null; render(); });
  const goForgot = document.getElementById('go-forgot');
  if(goForgot) goForgot.addEventListener('click', (e)=>{ e.preventDefault(); loginView='forgot'; loginMsg=null; render(); });
  const backLogin = document.getElementById('back-login');
  if(backLogin) backLogin.addEventListener('click', (e)=>{ e.preventDefault(); loginView='login'; loginMsg=null; render(); });

  const signupForm = document.getElementById('signup-form');
  if(signupForm) signupForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('su-name').value.trim();
    const username = document.getElementById('su-user').value.trim();
    const pass = document.getElementById('su-pass').value;
    const pass2 = document.getElementById('su-pass2').value;
    if(!name || !username || !pass){ loginMsg={type:'error', text:'Fill in every field.'}; render(); return; }
    if(pass !== pass2){ loginMsg={type:'error', text:'Passwords do not match.'}; render(); return; }
    if(DB.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){
      loginMsg={type:'error', text:'That username is already taken.'}; render(); return;
    }
    const user = {username, name, role:'clerk', password:pass};
    DB.users.push(user);
    await saveTable('users');
    currentUser = {username:user.username, role:user.role, name:user.name};
    setActiveTab(defaultTabFor(user.role), {replace:true});
    loginView='login'; loginMsg=null;
    render();
    showToast('Account created - welcome!');
  });

  const forgotForm = document.getElementById('forgot-form');
  if(forgotForm) forgotForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const username = document.getElementById('fp-user').value.trim();
    const name = document.getElementById('fp-name').value.trim();
    const pass = document.getElementById('fp-pass').value;
    const pass2 = document.getElementById('fp-pass2').value;
    if(pass !== pass2){ loginMsg={type:'error', text:'Passwords do not match.'}; render(); return; }
    const idx = DB.users.findIndex(u=>u.username.toLowerCase()===username.toLowerCase()
      && u.name.trim().toLowerCase()===name.toLowerCase());
    if(idx===-1){ loginMsg={type:'error', text:"That username and name don't match any account."}; render(); return; }
    DB.users[idx] = {...DB.users[idx], password:pass};
    await saveTable('users');
    loginView='login';
    loginMsg={type:'success', text:'Password reset - sign in with your new password.'};
    render();
  });
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== toolbar search (partial match) =====================
   Used by the Consumers, Meters, Meter Readings, Bills and Payments pages:
   the person types text and any row where that text appears anywhere inside
   one of that record's particulars is shown - matching is a case-insensitive
   substring check against each field, not just a whole-value match, so a
   search can be entered from any part of any of the fields. */
function normalizeSearchValue(v){
  return String(v==null?'':v).trim().toLowerCase();
}
function matchesExact(query, fields){
  const q = normalizeSearchValue(query);
  if(!q) return true;
  return fields.some(f=>normalizeSearchValue(f).includes(q));
}
function searchToolbarHtml(inputId, btnId, clearId, query, placeholder){
  return `
  <div class="qs-row" style="margin-bottom:0;max-width:420px;flex:1 1 320px;">
    <input id="${inputId}" placeholder="${escapeHtml(placeholder)}" autocomplete="off" value="${escapeHtml(query)}"/>
    <button id="${btnId}">Search</button>
    ${query ? `<button id="${clearId}" class="btn-cancel">Clear</button>` : ''}
  </div>`;
}
function attachSearchToolbarHandlers(inputId, btnId, clearId, applyQuery, clearQuery){
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  const clear = document.getElementById(clearId);
  const run = ()=>{ applyQuery((document.getElementById(inputId).value||'').trim()); render(); };
  if(btn) btn.addEventListener('click', run);
  if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); run(); } });
  if(clear) clear.addEventListener('click', ()=>{ clearQuery(); render(); });
}

function animateDashboardEntrance(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.progress-fill[data-target-width]').forEach(el=>{
    const target = el.getAttribute('data-target-width');
    if(reduce){ el.style.width = target; return; }
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ el.style.width = target; }); });
  });
  if(reduce){
    document.querySelectorAll('.stat-value .cnt[data-count]').forEach(el=>{
      el.textContent = el.getAttribute('data-count');
    });
    return;
  }
  document.querySelectorAll('.stat-value .cnt[data-count]').forEach(el=>{
    const to = parseInt(el.getAttribute('data-count'), 10) || 0;
    const duration = 550;
    const start = performance.now();
    function step(now){
      const p = Math.min((now-start)/duration, 1);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(to*eased);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

      meter_id: (document.getElementById('f-meter_id').value||'').trim(),
      consumer_no: document.getElementById('f-consumer_no').value,
      meter_number: document.getElementById('f-meter_number').value.trim(),
      status: document.getElementById('f-status').value
    };
    if(!rec.meter_id || !rec.consumer_no){ showToast('Meter ID and Consumer are required'); return; }
    if(editingRecord){
      const idx = DB.meters.findIndex(m=>m.meter_id===editingRecord.meter_id);
      DB.meters[idx] = rec;
      await saveTable('meters');
      showToast('Meter saved');
    } else {
      const dupNumber = rec.meter_number ? DB.meters.find(m=>m.meter_number.trim().toLowerCase()===rec.meter_number.trim().toLowerCase()) : null;
      if(dupNumber){
        dupNumber.consumer_no = rec.consumer_no;
        dupNumber.status = rec.status;
        await saveTable('meters');
        showToast(`Merged into existing meter ${dupNumber.meter_id}`);
      } else {
        if(DB.meters.some(m=>m.meter_id===rec.meter_id)){ showToast('That Meter ID already exists'); return; }
        DB.meters.push(rec);
        await saveTable('meters');
        showToast('Meter saved');
      }
    }
    meterFormPrefillConsumer=null; openForm=null; editingRecord=null;
    render();
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      meterFormPrefillConsumer=null;
      editingRecord = DB.meters.find(m=>m.meter_id===btn.getAttribute('data-edit'));
      openForm='meters';
      render();
    });
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-delete');
      const blockers = blockersForMeter(id);
      if(blockers.length){
        showToast(`Can't delete - remove this meter's ${blockers.join(' and ')} first`);
        return;
      }
      askDelete(`Meter ${id} will be removed.`, ()=>deleteRecord('meters', m=>m.meter_id===id));
    });
  });
}

/* ===================== METER READINGS ===================== */
function renderReadings(){
  let rows = [...DB.meter_readings].sort((a,b)=>(b.reading_date||'').localeCompare(a.reading_date||''));
  const filterActive = readingsHeadsUpFilter==='unbilled';
  if(filterActive){
    rows = rows.filter(r=>!DB.bills.some(b=>b.reading_id===r.reading_id));
  }
  if(readingsSearchQuery){
    rows = rows.filter(r=>{
      const billed = DB.bills.some(b=>b.reading_id===r.reading_id);
      const consumption = r.current_reading - r.previous_reading;
      return matchesExact(readingsSearchQuery, [
        r.reading_id, r.meter_id, consumerName(meterConsumer(r.meter_id)), r.reading_date,
        r.previous_reading, r.current_reading, consumption, billed ? 'Billed' : 'Pending'
      ]);
    });
  }
  const formHtml = openForm==='meter_readings' ? readingForm() : '';
  return `
  <div class="page-head">
    <div><h1 class="page-title">Meter Readings</h1><div class="page-desc">Reading history used to calculate consumption for billing</div></div>
  </div>
  ${filterActive ? `<div class="banner">Showing only: <b>Readings awaiting billing</b>${' '}<button class="btn-cancel" id="clear-readings-filter">Show all readings</button></div>` : ''}
  <div class="toolbar" style="justify-content:space-between;flex-wrap:wrap;">
    ${searchToolbarHtml('search-readings','search-readings-btn','search-readings-clear', readingsSearchQuery, 'Search readings (any field)')}
    <div>${openForm==='meter_readings' ? '' : `<button class="btn-add" id="add-reading">+ Record reading</button>`}</div>
  </div>
  ${formHtml}
  <div class="table-wrap">
    <table>
      <thead><tr><th>Reading ID</th><th>Meter</th><th>Consumer</th><th>Date</th><th>Previous</th><th>Current</th><th>Consumption</th><th>Outstanding</th><th>Billed?</th><th></th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(r=>{
          const billed = DB.bills.some(b=>b.reading_id===r.reading_id);
          const carried = outstandingCarriedForReading(r);
          return `<tr>
            <td class="num">${escapeHtml(r.reading_id)}</td>
            <td class="num">${escapeHtml(r.meter_id)}</td>
            <td>${escapeHtml(consumerName(meterConsumer(r.meter_id)))}</td>
            <td class="num">${r.reading_date}</td>
            <td class="num">${r.previous_reading}</td>
            <td class="num">${r.current_reading}</td>
            <td class="num">${r.current_reading - r.previous_reading}</td>
            <td class="num">${carried>0 ? `<span class="pill pill-partial">Nu. ${money(carried)} due</span>` : ''}</td>
            <td>${billed ? '<span class="pill pill-active">Billed</span>' : '<span class="pill pill-partial">Pending</span>'}</td>
            <td class="row-actions">${billed ? '' : `<button class="del" data-delete="${escapeHtml(r.reading_id)}">Delete</button>`}</td>
          </tr>`;
        }).join('') : `<tr><td colspan="10" class="empty">${readingsSearchQuery ? `No reading found matching "${escapeHtml(readingsSearchQuery)}"` : (filterActive ? 'No readings awaiting billing right now' : 'No readings recorded yet')}</td></tr>`}
      </tbody>
    </table>
  </div>`;
}
function readingForm(){
  const meterOptions = DB.meters.filter(m=>m.status==='Active').map(m=>
    `<option value="${escapeHtml(m.meter_id)}">${escapeHtml(m.meter_id)} - ${escapeHtml(consumerName(m.consumer_no))}</option>`).join('');
  return `

      <div><label>Reading Date</label><input type="date" id="f-reading_date" value="${todayISO()}"/></div>
      <div><label>Previous Reading</label><input type="number" id="f-previous_reading" step="1" min="0"/></div>
      <div><label>Current Reading</label><input type="number" id="f-current_reading" step="1" min="0"/></div>
    </div>
    <div class="hint">Previous reading is filled in automatically from the meter's last reading - adjust if needed.</div>
    <div class="form-actions">
      <button class="btn-save" id="save-reading">Save reading</button>
      <button class="btn-cancel" id="cancel-reading">Cancel</button>
